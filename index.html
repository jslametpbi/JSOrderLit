function stat(t,v,s){return `<div class="card pad stat"><p>${esc(t)}</p><h3>${v}</h3><small>${esc(s)}</small></div>`}
function dashboard(){return `<div class="layout"><div class="card pad"><h3 style="margin-top:0">Integrated Project Overview</h3>${projectTable(filtered().slice(0,6),true)}</div><div class="card pad"><h3 style="margin-top:0">Fast Actions</h3><button class="btn" style="width:100%;margin-bottom:10px" data-open="project">＋ Add Project Metadata</button><button class="btn sec" style="width:100%;margin-bottom:10px" data-nav="Invoices">▤ Manage Invoices</button><button class="btn sec" style="width:100%;margin-bottom:10px" data-nav="Receipts">▥ Manage Receipts</button><button class="btn sec" style="width:100%" data-nav="Cashflow">▦ Monthly Cashflow</button><div class="box" style="margin-top:18px"><p class="note"><b>Integrated rule:</b> one project has one metadata record, one invoice, one receipt/payment record, and one cashflow row.</p></div></div></div>`}
function filtered(){let q=state.q.toLowerCase();return state.projects.filter(p=>[p.id,p.title,p.leadOrder,p.projectCategory,p.journal,p.currentStatus,p.followUpStatus,p.metadata?.institution,p.metadata?.pic,authText(p.authors)].join(" ").toLowerCase().includes(q)&&(state.sf==="All"||p.currentStatus===state.sf)&&(state.cf==="All"||p.projectCategory===state.cf))}

function projectTable(rows){if(!rows.length)return `<div class="empty"><b>No project yet</b><br>Add your first integrated project metadata.</div>`;return `<div class="card table"><table><thead><tr><th>Order ID</th><th>Date</th><th>Integrated Metadata</th><th>Client/PIC</th><th>Service</th><th>Finance</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.id)}</b></td><td>${esc(p.orderDate||"-")}</td><td><b>${esc(p.title)}</b><br><small>Category: ${esc(p.projectCategory)}</small><br><small>Institution: ${esc(p.metadata?.institution||"-")}</small><br><small>Authors: ${esc(authText(p.authors))}</small></td><td>${esc(p.leadOrder||"-")}<br><small>PIC: ${esc(p.metadata?.pic||"-")}</small><br><small>WA: ${esc(p.metadata?.clientWa||"-")}</small><br><small>Next: ${esc(p.followUpStatus||"-")} ${p.followUpDate?"("+esc(p.followUpDate)+")":""}</small></td><td><b>${esc(p.scopusCategory||"-")}</b><br><small>${esc(p.journal||"-")}</small></td><td><b>Invoice: ${esc(p.invoice.id)}</b><br><small>Receipt: ${esc(p.receipt.id)}</small><br><small>Invoiced: ${money(p.invoice.total)}</small><br><small>Paid: ${money(p.receipt.amount)}</small><br><small>Balance: ${money(p.invoice.total-p.receipt.amount)}</small><br>${badge(p.financeStatus)}</td><td>${badge(p.currentStatus||p.status||"Draft")}</td><td><button class="btn sm sec" data-open="project" data-id="${esc(p.id)}">Metadata</button><br><button class="btn sm sec" data-open="status" data-id="${esc(p.id)}">Status</button><br><button class="btn sm sec" data-open="invoice" data-id="${esc(p.id)}">Invoice</button><br><button class="btn sm sec" data-open="receipt" data-id="${esc(p.id)}">Receipt</button><br><button class="btn sm danger" data-delete="${esc(p.id)}">Delete</button></td></tr>`).join("")}</tbody></table></div>`}
function invoicesPage(){let rows=filteredInvoice();return `<div class="card pad" style="margin-bottom:18px"><input id="searchBox" value="${esc(state.q)}" placeholder="Search invoice or project"><p class="note">Invoice edits update project finance and cashflow automatically.</p></div>${invoiceTable(rows)}`}
function filteredInvoice(){let q=state.q.toLowerCase();return state.projects.filter(p=>[p.invoice.id,p.invoice.billTo,p.invoice.description,p.invoice.status,p.title].join(" ").toLowerCase().includes(q))}
function invoiceTable(rows){if(!rows.length)return `<div class="empty"><b>No invoice data</b></div>`;return `<div class="card table"><table><thead><tr><th>Invoice</th><th>Issue Date</th><th>Bill To</th><th>Project</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.invoice.id)}</b></td><td>${esc(p.invoice.issueDate||"-")}</td><td>${esc(p.invoice.billTo||"-")}</td><td>${esc(p.id)}<br><small>${esc(p.invoice.description)}</small></td><td><b>${money(p.invoice.total)}</b></td><td>${badge(p.invoice.status)}</td><td><button class="btn sm sec" data-preview="invoice" data-id="${esc(p.id)}">Preview</button><br><button class="btn sm sec" data-open="invoice" data-id="${esc(p.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div>`}
function receiptsPage(){let q=state.q.toLowerCase(),rows=state.projects.filter(p=>[p.receipt.id,p.receipt.paidBy,p.receipt.method,p.receipt.reference,p.title].join(" ").toLowerCase().includes(q));return `<div class="card pad" style="margin-bottom:18px"><input id="searchBox" value="${esc(state.q)}" placeholder="Search receipt or project"><p class="note">Receipt payment date is independent from invoice issue date.</p></div>${receiptTable(rows)}`}
function receiptTable(rows){if(!rows.length)return `<div class="empty"><b>No receipt data</b></div>`;return `<div class="card table"><table><thead><tr><th>Receipt</th><th>Payment Date</th><th>Paid By</th><th>Linked Invoice</th><th>Amount</th><th>Method</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.receipt.id)}</b></td><td>${esc(p.receipt.paymentDate||"-")}</td><td>${esc(p.receipt.paidBy||"-")}</td><td>${esc(p.invoice.id)}<br><small>Project: ${esc(p.id)}</small></td><td><b>${money(p.receipt.amount)}</b></td><td>${esc(p.receipt.method||"-")}</td><td><button class="btn sm sec" data-preview="receipt" data-id="${esc(p.id)}">Preview</button><br><button class="btn sm sec" data-open="receipt" data-id="${esc(p.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div>`}
function cashRows(){let m=state.month;return state.projects.map(p=>({p,ok:m==="All"||mkey(p.orderDate)===m||mkey(p.invoice.issueDate)===m||mkey(p.receipt.paymentDate)===m})).filter(x=>x.ok).map(x=>({p:x.p,inv:num(x.p.invoice.total),paid:num(x.p.receipt.amount),bal:num(x.p.invoice.total)-num(x.p.receipt.amount)}))}
function cashflowPage(){let months=[...new Set(state.projects.flatMap(p=>[mkey(p.orderDate),mkey(p.invoice.issueDate),mkey(p.receipt.paymentDate)].filter(Boolean)))].sort().reverse();if(!months.length)months=[new Date().toISOString().slice(0,7)];if(!state.month)state.month=months[0];let rows=cashRows(),inv=rows.reduce((s,r)=>s+r.inv,0),paid=rows.reduce((s,r)=>s+r.paid,0),out=rows.reduce((s,r)=>s+Math.max(0,r.bal),0);return `<div class="box" style="margin-bottom:18px"><b>Monthly Cashflow Control:</b> select month and edit invoice or receipt directly from each row.</div><div class="card toolbar"><select id="monthFilter"><option value="All" ${state.month==="All"?"selected":""}>All Months</option>${months.map(m=>`<option value="${m}" ${state.month===m?"selected":""}>${esc(m)}</option>`).join("")}</select><button class="btn sec" data-export="cashflow">⬇ Export Cashflow</button><button class="btn sec" data-print="1">Print</button><button class="btn" data-open="project">＋ Add Project</button></div><div class="cash">${stat("Projects",rows.length,"Selected period")}${stat("Invoice Issued",money(inv),"Monthly invoices")}${stat("Cash Received",money(paid),"Monthly income")}${stat("Outstanding",money(out),"Unpaid balance")}</div><div class="card table"><table><thead><tr><th>Project</th><th>Dates</th><th>Invoice</th><th>Receipt</th><th>Cash In</th><th>Balance</th><th>Edit</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.p.id)}</b><br><small>${esc(r.p.title)}</small></td><td><small>Order: ${esc(r.p.orderDate||"-")}</small><br><small>Invoice: ${esc(r.p.invoice.issueDate||"-")}</small><br><small>Payment: ${esc(r.p.receipt.paymentDate||"-")}</small></td><td><b>${esc(r.p.invoice.id)}</b><br>${badge(r.p.invoice.status)}<br>${money(r.inv)}</td><td><b>${esc(r.p.receipt.id)}</b><br>${esc(r.p.receipt.method||"-")}</td><td><b>${money(r.paid)}</b></td><td><b>${money(r.bal)}</b></td><td><button class="btn sm sec" data-open="invoice" data-id="${esc(r.p.id)}">Invoice</button><br><button class="btn sm sec" data-open="receipt" data-id="${esc(r.p.id)}">Receipt</button></td></tr>`).join("")}</tbody></table></div>`}
function settingsPage(){let b=state.business;return `<div class="card pad"><h3 style="margin-top:0">Business Settings</h3><form id="settingsForm" class="fg"><input name="businessName" value="${esc(b.businessName)}"><input name="ownerName" value="${esc(b.ownerName)}"><input name="email" value="${esc(b.email)}"><input name="whatsapp" value="${esc(b.whatsapp)}"><select name="currency">${curr.map(c=>`<option ${b.currency===c?"selected":""}>${c}</option>`).join("")}</select><input name="bankName" value="${esc(b.bankName)}"><input name="accountNumber" value="${esc(b.accountNumber)}"><input name="bankName2" value="${esc(b.bankName2)}"><input name="accountNumber2" value="${esc(b.accountNumber2)}"><div class="span2"><button class="btn">Save Settings</button> <button type="button" class="btn sec" data-pin="1">Change PIN</button></div></form></div>`}
function drawer(){if(!state.drawer)return "";let p=state.editId?getP(state.editId):null;let title={project:"Project Metadata",status:"Project Status Workflow",invoice:"Integrated Invoice",receipt:"Integrated Receipt / Payment"}[state.drawer];let body=state.drawer==="project"?projectForm(p):state.drawer==="status"?statusForm(p):state.drawer==="invoice"?invoiceForm(p):receiptForm(p);return `<div class="drawerbg show"><div class="drawer"><div class="dh"><div><h3>${title}</h3><p class="note">All changes save into the same integrated project record.</p></div><button class="btn sec sm" data-close="1">×</button></div><div class="body">${body}</div></div></div>`}
function projectForm(p){p=p||{};let d=p.orderDate||today();return `<form id="projectForm" class="fg"><div class="sect">Project Metadata</div><input name="id" value="${esc(p.id||oid(d))}" readonly><input name="orderDate" type="date" value="${esc(d)}"><input class="span2" name="title" value="${esc(p.title||"")}" placeholder="Project / manuscript title" required><select name="projectCategory">${cats.map(x=>`<option ${p.projectCategory===x?"selected":""}>${esc(x)}</option>`).join("")}</select><input name="leadOrder" value="${esc(p.leadOrder||"")}" placeholder="Lead order / client" required><input name="clientAddress" value="${esc(p.clientAddress||"")}" placeholder="Client address"><input name="metadata.institution" value="${esc(p.metadata?.institution||"")}" placeholder="Institution / affiliation"><input name="metadata.pic" value="${esc(p.metadata?.pic||"")}" placeholder="PIC / contact person"><input name="metadata.clientWa" value="${esc(p.metadata?.clientWa||"")}" placeholder="Client WhatsApp"><input name="metadata.clientEmail" value="${esc(p.metadata?.clientEmail||"")}" placeholder="Client Email"><input name="correspondingAuthor" value="${esc(p.correspondingAuthor||"")}" placeholder="Corresponding author"><input name="authors" value="${esc(authText(p.authors)==="-"?"":authText(p.authors))}" placeholder="Authors separated by comma"><select name="scopusCategory">${qs.map(x=>`<option ${p.scopusCategory===x?"selected":""}>${x}</option>`).join("")}</select><input name="journal" value="${esc(p.journal||"")}" placeholder="Target journal / publisher / service note"><input name="price" type="number" value="${esc(p.price||"")}" placeholder="Project fee"><select name="paymentTerm">${terms.map(x=>`<option ${p.paymentTerm===x?"selected":""}>${x}</option>`).join("")}</select><div class="sect">Status Workflow</div><select name="currentStatus">${statuses.map(x=>`<option ${p.currentStatus===x||p.status===x?"selected":""}>${x}</option>`).join("")}</select><input name="deadline" type="date" value="${esc(p.deadline||"")}"><select name="followUpStatus"><option value="">Next / follow-up status</option>${statuses.map(x=>`<option ${p.followUpStatus===x?"selected":""}>${x}</option>`).join("")}</select><input name="followUpDate" type="date" value="${esc(p.followUpDate||"")}"><textarea class="span2" name="statusNotes" placeholder="Status notes">${esc(p.statusNotes||"")}</textarea><textarea class="span2" name="notes" placeholder="Project notes">${esc(p.notes||"")}</textarea><div class="span2 box"><p class="note">Saving metadata automatically creates/updates different invoice and receipt codes. Invoice issue date and receipt payment date remain separate.</p></div><div class="span2" style="text-align:right"><button type="button" class="btn sec" data-close="1">Cancel</button> <button class="btn">Save Integrated Metadata</button></div></form>`}
function statusForm(p){if(!p)return `<div class="empty"><b>Select a project first</b></div>`;let hist=(p.statusHistory||[]).map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.previousStatus)}</td><td>${esc(h.currentStatus)}</td><td>${esc(h.followUpStatus)}</td><td>${esc(h.note)}</td></tr>`).join("");return `<form id="statusForm" class="fg"><input name="projectId" value="${esc(p.id)}" readonly><input value="${esc(p.title||"")}" readonly><select name="previousStatus"><option value="">Previous Status</option>${statuses.map(x=>`<option ${p.previousStatus===x?"selected":""}>${x}</option>`).join("")}</select><select name="currentStatus">${statuses.map(x=>`<option ${p.currentStatus===x?"selected":""}>${x}</option>`).join("")}</select><select name="followUpStatus"><option value="">Next / Follow-up Status</option>${statuses.map(x=>`<option ${p.followUpStatus===x?"selected":""}>${x}</option>`).join("")}</select><input name="followUpDate" type="date" value="${esc(p.followUpDate||"")}"><textarea class="span2" name="statusNotes" placeholder="Status notes">${esc(p.statusNotes||"")}</textarea><div class="span2 table"><table><thead><tr><th>Date</th><th>Previous</th><th>Current</th><th>Follow-up</th><th>Note</th></tr></thead><tbody>${hist||"<tr><td colspan='5'>No status history yet.</td></tr>"}</tbody></table></div><div class="span2" style="text-align:right"><button type="button" class="btn sec" data-close="1">Cancel</button> <button class="btn">Save Status</button></div></form>`}
function invoiceForm(p){p=p||state.projects[0];if(!p)return `<div class="empty"><b>No project</b></div>`;let i=p.invoice;return `<form id="invoiceForm" class="fg"><input name="projectId" value="${esc(p.id)}" readonly><input name="id" value="${esc(i.id)}" readonly><input name="issueDate" type="date" value="${esc(i.issueDate||today())}"><input name="dueDate" type="date" value="${esc(i.dueDate||"")}"><input name="billTo" value="${esc(i.billTo||"")}" placeholder="Bill to"><input name="clientAddress" value="${esc(i.clientAddress||"")}" placeholder="Address"><input class="span2" name="description" value="${esc(i.description||"")}" placeholder="Description"><input name="amount" type="number" value="${esc(i.amount||0)}"><input name="discount" type="number" value="${esc(i.discount||0)}"><input name="tax" type="number" value="${esc(i.tax||0)}"><textarea class="span2" name="notes" placeholder="Invoice notes">${esc(i.notes||"")}</textarea><div class="span2 box"><p class="note">Invoice code starts with INV. Issue date is separate from receipt payment date.</p></div><div class="span2" style="text-align:right"><button type="button" class="btn sec" data-close="1">Cancel</button> <button class="btn">Save Integrated Invoice</button></div></form>`}
function receiptForm(p){p=p||state.projects[0];if(!p)return `<div class="empty"><b>No project</b></div>`;let r=p.receipt;return `<form id="receiptForm" class="fg"><input name="projectId" value="${esc(p.id)}" readonly><input name="id" value="${esc(r.id)}" readonly><input name="invoiceId" value="${esc(p.invoice.id)}" readonly><input name="paymentDate" type="date" value="${esc(r.paymentDate||"")}"><input name="paidBy" value="${esc(r.paidBy||"")}" placeholder="Paid by"><input name="amount" type="number" value="${esc(r.amount||0)}" placeholder="Amount paid"><input name="method" value="${esc(r.method||"Bank Transfer")}"><input name="reference" value="${esc(r.reference||"")}"><input name="receivedBy" value="${esc(r.receivedBy||state.business.ownerName)}"><textarea class="span2" name="notes" placeholder="Receipt notes">${esc(r.notes||"")}</textarea><div class="span2 box"><p class="note">Receipt code starts with RCP. Leave payment date empty until payment is received.</p></div><div class="span2" style="text-align:right"><button type="button" class="btn sec" data-close="1">Cancel</button> <button class="btn">Save Integrated Receipt</button></div></form>`}
function applyProject(form){let raw=fd(form),x={};Object.entries(raw).forEach(([k,v])=>nested(x,k,v));x.authors=auth(x.authors);x.price=num(x.price);let ix=state.projects.findIndex(p=>p.id===x.id);if(ix>=0){let old=state.projects[ix],oldSt=old.currentStatus||old.status||"Draft";x.invoice=old.invoice;x.receipt=old.receipt;x.statusHistory=old.statusHistory||[];x.previousStatus=oldSt;let merged=norm(Object.assign(old,x));if(oldSt!==merged.currentStatus||merged.followUpStatus||merged.statusNotes)merged.statusHistory.unshift({date:today(),previousStatus:oldSt,currentStatus:merged.currentStatus,followUpStatus:merged.followUpStatus||"-",note:merged.statusNotes||""});state.projects[ix]=merged}else{let p=norm(x);p.statusHistory=[{date:today(),previousStatus:"-",currentStatus:p.currentStatus,followUpStatus:p.followUpStatus||"-",note:"Project created."}];state.projects.unshift(p)}save();closeD()}
function applyStatus(form){let x=fd(form),p=getP(x.projectId);if(!p)return;let old=p.currentStatus||p.status||"Draft";p.previousStatus=x.previousStatus||old;p.currentStatus=x.currentStatus||old;p.status=p.currentStatus;p.followUpStatus=x.followUpStatus||"";p.followUpDate=x.followUpDate||"";p.statusNotes=x.statusNotes||"";p.statusHistory=p.statusHistory||[];p.statusHistory.unshift({date:today(),previousStatus:old,currentStatus:p.currentStatus,followUpStatus:p.followUpStatus||"-",note:p.statusNotes||""});norm(p);save();closeD()}
function applyInvoice(form){let x=fd(form),p=getP(x.projectId);if(!p)return;p.invoice=Object.assign(p.invoice,x);if(!String(p.invoice.id).startsWith("INV-"))p.invoice.id=code("INV",p.invoice.issueDate||p.orderDate);p.invoice.amount=num(p.invoice.amount);p.invoice.discount=num(p.invoice.discount);p.invoice.tax=num(p.invoice.tax);p.invoice.total=calc(p.invoice);p.receipt.invoiceId=p.invoice.id;norm(p);save();closeD()}
function applyReceipt(form){let x=fd(form),p=getP(x.projectId);if(!p)return;p.receipt=Object.assign(p.receipt,x);if(!String(p.receipt.id).startsWith("RCP-"))p.receipt.id=code("RCP",p.receipt.paymentDate||p.orderDate);p.receipt.amount=num(p.receipt.amount);p.receipt.invoiceId=p.invoice.id;norm(p);save();closeD()}
function preview(){if(!state.preview)return "";let p=getP(state.preview.id),type=state.preview.type;if(!p)return "";let item=type==="invoice"?p.invoice:p.receipt,isInv=type==="invoice",title=isInv?"INVOICE":"OFFICIAL RECEIPT",date=isInv?item.issueDate:item.paymentDate,client=isInv?item.billTo:item.paidBy,amount=isInv?item.total:item.amount,stamp=isInv?"ISSUED":"PAID";return `<div class="prevbg show"><div class="prev"><div class="dh"><div><h3>${title} Preview</h3><p class="note">Preview, print, download PDF, or close.</p></div><div><button class="btn sec sm" data-pdf="1">Download PDF</button> <button class="btn sec sm" data-print="1">Print</button> <button class="btn sec sm" data-closeprev="1">×</button></div></div><div id="printArea"><div class="doc"><div class="formal"></div><div class="dochead"><div style="display:flex;gap:14px;align-items:center"><div class="doclogo">JS</div><div><h2 style="margin:0">${esc(state.business.businessName)}</h2><p class="note">${esc(state.business.headerTagline)}<br>WhatsApp: ${esc(state.business.whatsapp)} | Email: ${esc(state.business.email)}</p></div></div><div><div class="doctitle">${title}</div><div class="line"></div><p class="note" style="text-align:right">No: ${esc(item.id)}<br>Date: ${esc(date||"-")}</p></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="box"><b>Bill To / Client</b><h3>${esc(client||"-")}</h3><p class="note">${esc(item.clientAddress||p.clientAddress||"-")}</p></div><div class="box"><b>Project Reference</b><h3>${esc(p.id)}</h3><p class="note">${esc(p.title)}<br><b>Category:</b> ${esc(p.projectCategory)}</p></div></div><div class="table" style="margin-top:18px"><table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr><td>${isInv?esc(item.description):`Payment received via ${esc(item.method||"-")}, reference ${esc(item.reference||"-")}`}</td><td style="text-align:right"><b>${money(amount)}</b></td></tr></tbody><tfoot><tr><td style="text-align:right"><b>TOTAL</b></td><td style="text-align:right"><b>${money(amount)}</b></td></tr></tfoot></table></div><div class="box" style="margin-top:18px"><b>Bank Account & Payment Contact</b><p class="note"><b>${esc(state.business.bankName)}:</b> ${esc(state.business.accountNumber)} a.n. ${esc(state.business.accountHolder)}<br><b>${esc(state.business.bankName2)}:</b> ${esc(state.business.accountNumber2)} a.n. ${esc(state.business.accountHolder2)}<br><b>WhatsApp:</b> ${esc(state.business.whatsapp)}</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;align-items:end"><div><small>Notes</small><p class="note">${esc(item.notes||"-")}</p></div><div><div class="stampwrap"><div class="stamp"><div><small>Official</small><br><b>${stamp}</b><br><small>${esc(date||"")}</small></div></div><div class="sigpanel"><p class="note">Authorized Signature</p><img class="sig" src="${SIG||state.business.signatureImage||""}"><div class="sigline">${esc(state.business.ownerName)}</div></div></div></div></div><div class="footer"><span>${esc(state.business.businessName)}</span><span>${esc(state.business.email)} | ${esc(state.business.whatsapp)}</span></div></div></div></div></div>`}
function downloadPDF(){let p=getP(state.preview.id),type=state.preview.type,item=type==="invoice"?p.invoice:p.receipt,name=(type==="invoice"?`Invoice-${item.id}-${p.id}`:`Receipt-${item.id}-${p.id}`)+".pdf",area=document.getElementById("printArea");if(window.html2pdf)html2pdf().set({margin:0,filename:name,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"pt",format:"a4",orientation:"portrait"}}).from(area).save();else window.print()}
function exportData(kind){let rows=kind==="projects"?state.projects:kind==="invoices"?state.projects.map(p=>p.invoice):kind==="cashflow"?cashRows().map(r=>({projectId:r.p.id,title:r.p.title,invoice:r.p.invoice.id,receipt:r.p.receipt.id,invoiceAmount:r.inv,paid:r.paid,balance:r.bal,status:r.p.financeStatus})):[];if(!rows.length){alert("No data.");return}let flat=rows.map(r=>flatten(r)),h=Object.keys(flat[0]),csv=[h.join(","),...flat.map(r=>h.map(k=>{let v=String(r[k]??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`JSOrderLit-${kind}.csv`;a.click()}
function flatten(o,p="",out={}){for(let k in o){let v=o[k],key=p?p+"."+k:k;if(v&&typeof v==="object"&&!Array.isArray(v))flatten(v,key,out);else out[key]=Array.isArray(v)?v.join("; "):v}return out}
function render(){if(!unlocked){document.getElementById("app").innerHTML=pinScreen();setTimeout(()=>{let i=document.getElementById("pinInput");if(i)i.focus()},50);return}state.projects=state.projects.map(norm);let c=state.active==="Dashboard"?dashboard():state.active==="Projects"?projectsPage():state.active==="Invoices"?invoicesPage():state.active==="Receipts"?receiptsPage():state.active==="Cashflow"?cashflowPage():settingsPage();document.getElementById("app").innerHTML=shell(c)}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.nav)nav(b.dataset.nav);if(b.dataset.open)openD(b.dataset.open,b.dataset.id||null);if(b.dataset.close)closeD();if(b.dataset.closeprev)closePrev();if(b.dataset.preview)openPrev(b.dataset.preview,b.dataset.id);if(b.dataset.delete){if(confirm("Delete this project and its integrated invoice/receipt/cashflow?")){state.projects=state.projects.filter(p=>p.id!==b.dataset.delete);save();render()}}if(b.dataset.lock){sessionStorage.removeItem("jsorderlit_unlocked");unlocked=false;render()}if(b.dataset.print)window.print();if(b.dataset.pdf)downloadPDF();if(b.dataset.export)exportData(b.dataset.export);if(b.dataset.reset){state.q="";state.cf="All";state.sf="All";render()}if(b.dataset.pin){let old=prompt("Enter current PIN:");if(old===null)return;if(old!==(localStorage.getItem("jsorderlit_pin")||PIN)){alert("Current PIN is incorrect.");return}let n=prompt("Enter new PIN, 4-12 digits:");if(n&&/^\d{4,12}$/.test(n)){localStorage.setItem("jsorderlit_pin",n);alert("PIN updated.")}}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="pinForm"){let pin=document.getElementById("pinInput").value.trim(),err=document.getElementById("pinErr");if(pin===(localStorage.getItem("jsorderlit_pin")||PIN)){sessionStorage.setItem("jsorderlit_unlocked","yes");unlocked=true;render()}else{err.style.display="block";err.textContent="Incorrect PIN.";return}}if(e.target.id==="projectForm")applyProject(e.target);if(e.target.id==="statusForm")applyStatus(e.target);if(e.target.id==="invoiceForm")applyInvoice(e.target);if(e.target.id==="receiptForm")applyReceipt(e.target);if(e.target.id==="settingsForm"){state.business=Object.assign(state.business,fd(e.target));save();alert("Settings saved.");render()}});
document.addEventListener("input",e=>{if(e.target.id==="searchBox"){state.q=e.target.value;render()}});
document.addEventListener("change",e=>{if(e.target.id==="catFilter"){state.cf=e.target.value;render()}if(e.target.id==="statFilter"){state.sf=e.target.value;render()}if(e.target.id==="monthFilter"){state.month=e.target.value;render()}if(e.target.name==="orderDate"&&e.target.form?.id==="projectForm"){let id=e.target.form.querySelector('[name=id]');if(id&&!id.value)id.value=oid(e.target.value)}});
render();
</script></body></html>
