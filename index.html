<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JSOrderLit Manager | Professional Project Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fb;color:#0f172a}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:300px;background:#020617;color:#fff;padding:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:13px;align-items:center;margin-bottom:28px}
.logo{width:54px;height:54px;border-radius:18px;background:#fff;color:#020617;font-weight:950;display:flex;align-items:center;justify-content:center;font-size:18px}
.brand h1{margin:0;font-size:22px;line-height:1.05;letter-spacing:-.04em}
.brand p{margin:4px 0 0;color:#a7b2c5;font-size:13px;line-height:1.25}
.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;padding:14px 15px;border-radius:17px;text-align:left;font-weight:850;margin-bottom:8px;display:flex;gap:9px;align-items:center}
.nav button:hover{background:#0f172a}
.nav button.active{background:#fff;color:#020617}
.profile{margin-top:26px;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:16px}
.profile p{margin:0;color:#9aa8bc;font-size:13px}
.profile strong{display:block;margin-top:4px;color:#fff;font-size:18px}
.main{flex:1;padding:34px;max-width:1680px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:9px 15px;color:#475569;box-shadow:0 2px 8px rgba(15,23,42,.05);font-weight:650;font-size:13px}
h2.page{font-size:42px;margin:14px 0 8px;letter-spacing:-.045em}
.subtitle{margin:0;color:#64748b;max-width:900px;line-height:1.55;font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:950;background:#0f172a;color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.secondary{background:#fff;color:#0f172a;border:1px solid #dfe7f2}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.small{padding:8px 12px;border-radius:12px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:26px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
.card.pad{padding:22px}
.stat p{margin:0;color:#64748b;font-size:14px}
.stat h3{margin:8px 0 4px;font-size:31px;letter-spacing:-.04em}
.stat small{color:#94a3b8}
.layout{display:grid;grid-template-columns:1fr 340px;gap:22px}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:14px;margin-bottom:20px;padding:18px}
input,select,textarea{width:100%;border:1px solid #dbe5f1;border-radius:15px;padding:12px 14px;outline:none;background:#fff;color:#0f172a}
textarea{min-height:95px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#64748b;box-shadow:0 0 0 4px rgba(100,116,139,.13)}
.table-wrap{overflow:auto;border-radius:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;background:#f8fafc;color:#475569;padding:14px 16px;white-space:nowrap;font-weight:950;border-bottom:1px solid #e2e8f0}
td{padding:15px 16px;border-top:1px solid #eef2f7;vertical-align:top;color:#334155}
tr:hover td{background:#fbfdff}
.badge{display:inline-block;border:1px solid #dbe5f1;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:950;background:#f8fafc;color:#334155}
.badge.green{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.badge.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.badge.amber{background:#fffbeb;color:#b45309;border-color:#fde68a}
.badge.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.drawer-bg{position:fixed;inset:0;background:rgba(2,6,23,.48);z-index:50;display:none;justify-content:flex-end;backdrop-filter:blur(4px)}
.drawer-bg.show{display:flex}
.drawer{width:min(820px,100%);min-height:100vh;background:#fff;overflow:auto;box-shadow:-20px 0 50px rgba(2,6,23,.2)}
.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:20px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.drawer-head h3{margin:0;font-size:24px;letter-spacing:-.04em}
.drawer-head p{margin:4px 0 0;color:#64748b}
.drawer-body{padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.span2{grid-column:span 2}
.note{color:#64748b;font-size:13px;line-height:1.5}
.mini-label{font-size:11px;font-weight:950;letter-spacing:.09em;text-transform:uppercase;color:#64748b}
.doc-meta-box{border:1px solid #dbeafe;border-radius:17px;background:#f8fbff;padding:14px}
.empty{border:1px dashed #cbd5e1;background:#f8fafc;border-radius:22px;padding:45px 20px;text-align:center;color:#64748b}
.empty strong{display:block;color:#0f172a;margin-bottom:5px;font-size:18px}
.preview-bg{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:60;display:none;justify-content:flex-end}
.preview-bg.show{display:flex}
.preview-panel{width:min(980px,100%);height:100vh;background:#fff;overflow:auto}
.preview-head{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:18px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.doc{width:794px;min-height:1123px;margin:24px auto;background:#fff;padding:30px;position:relative;border:1px solid #e2e8f0;box-shadow:0 18px 50px rgba(15,23,42,.12)}
.formal-top{height:14px;background:linear-gradient(90deg,#0f172a 0%,#1d4ed8 58%,#c89b2c 58%,#c89b2c 100%);margin:-30px -30px 24px}
.doc-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
.header-flex{display:flex;gap:14px;align-items:center}
.logo-print{width:62px;height:62px;border-radius:18px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:20px}
.doc-title{font-size:28px;font-weight:950;color:#1d4ed8;text-align:right}
.gold-line{height:3px;background:linear-gradient(90deg,#1d4ed8,#c89b2c);border-radius:999px;margin:10px 0}
.doc-table{border:1px solid #dbeafe;border-radius:16px;overflow:hidden;margin-top:18px}
.doc-table table{border-collapse:collapse;width:100%}
.doc-table th{background:#0f172a;color:#fff}
.doc-table th,.doc-table td{padding:13px 15px;border-bottom:1px solid #e2e8f0}
.doc-table tfoot td{background:#eff6ff;font-size:16px;font-weight:950}
.bank-box{border:1px solid #dbeafe;border-radius:16px;background:#f8fbff;padding:14px;margin-top:18px}
.approval-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;align-items:end}
.approval-box{display:flex;justify-content:flex-end;align-items:flex-end}
.signature-stamp-wrap{position:relative;width:305px;min-height:152px;margin-left:auto}
.signature-stamp-wrap .stamp{position:absolute;left:0;bottom:18px;z-index:3}
.signature-stamp-wrap .signature-panel{position:absolute;right:0;bottom:0;z-index:2;width:252px;text-align:right}
.sig-img{width:238px;height:92px;object-fit:contain;display:block;margin-left:auto;filter:contrast(1.25) saturate(1.1)}
.signature-name{border-top:1.6px solid #0f172a;display:inline-block;min-width:230px;padding-top:7px;margin-top:0;font-weight:950;color:#0f172a;text-align:center}
.stamp{width:120px;height:120px;border:4px double #1d4ed8;border-radius:999px;color:#1d4ed8;transform:rotate(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.7);font-weight:950;letter-spacing:.04em}
.stamp.red{border-color:#dc2626;color:#dc2626}
.stamp small{font-size:10px;text-transform:uppercase}
.stamp strong{font-size:21px;line-height:1;margin:4px 0}
.stamp span{font-size:10px}
.formal-footer{position:absolute;left:30px;right:30px;bottom:20px;border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;color:#64748b;font-size:11px}
.watermark{position:absolute;top:380px;left:185px;font-size:94px;font-weight:950;color:rgba(15,23,42,.035);transform:rotate(-18deg)}
@media(max-width:1100px){.app{display:block}.sidebar{width:auto;height:auto;position:relative}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}
@media(max-width:700px){.main{padding:18px}.grid4{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:span 1}h2.page{font-size:34px}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}.preview-head,.drawer-bg,.sidebar,.top,.grid4{display:none!important}.doc{box-shadow:none;border:0;margin:0;width:100%}}

.pin-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  background:
    radial-gradient(circle at 20% 0%, rgba(29,78,216,.16), transparent 28%),
    radial-gradient(circle at 84% 12%, rgba(200,155,44,.18), transparent 24%),
    linear-gradient(135deg,#020617 0%,#0f172a 48%,#1e293b 100%);
}
.pin-card{
  width:min(460px,100%);
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.7);
  border-radius:32px;
  padding:32px;
  box-shadow:0 30px 90px rgba(0,0,0,.32);
}
.pin-brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}
.pin-logo{
  width:64px;
  height:64px;
  border-radius:22px;
  background:#020617;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950;
  font-size:20px;
}
.pin-card h1{
  margin:0;
  font-size:28px;
  line-height:1.05;
  letter-spacing:-.045em;
}
.pin-card p{
  color:#64748b;
  line-height:1.55;
}
.pin-input{
  font-size:28px;
  text-align:center;
  letter-spacing:.28em;
  font-weight:900;
}
.pin-hint{
  margin-top:12px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:12px;
  font-size:13px;
  color:#64748b;
}
.pin-error{
  color:#b91c1c;
  background:#fef2f2;
  border:1px solid #fecaca;
  padding:10px 12px;
  border-radius:14px;
  margin-top:12px;
  display:none;
  font-weight:700;
}
.pin-row{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.pin-row .btn{
  flex:1;
}
.lock-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:900;
  margin-bottom:14px;
}


.cashflow-controls{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;margin-bottom:18px}
.cash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.cash-card{border:1px solid #e2e8f0;border-radius:22px;background:#fff;padding:18px;box-shadow:0 10px 28px rgba(15,23,42,.05)}
.cash-card p{margin:0;color:#64748b;font-size:13px}.cash-card h3{margin:8px 0 0;font-size:26px;letter-spacing:-.035em}
.cash-card.positive h3{color:#047857}.cash-card.warning h3{color:#b45309}.cash-card.negative h3{color:#b91c1c}
.cash-note{padding:14px 16px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:18px;line-height:1.5;font-size:13px;margin-bottom:18px}
@media(max-width:900px){.cashflow-controls{grid-template-columns:1fr}.cash-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cash-grid{grid-template-columns:1fr}}

</style>
</head>

const DEFAULT_PIN = "2026";
let isUnlocked = sessionStorage.getItem("jsorderlit_unlocked") === "yes";

function currentPin(){
  return localStorage.getItem("jsorderlit_pin") || DEFAULT_PIN;
}
function unlockWithPin(e){
  e.preventDefault();
  const pin = document.getElementById("pinInput").value.trim();
  const err = document.getElementById("pinError");
  if(pin === currentPin()){
    sessionStorage.setItem("jsorderlit_unlocked","yes");
    isUnlocked = true;
    render();
  } else {
    err.style.display = "block";
    err.textContent = "Incorrect PIN. Please try again.";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}
function logoutApp(){
  sessionStorage.removeItem("jsorderlit_unlocked");
  isUnlocked = false;
  render();
}
function changePinPrompt(){
  const oldPin = prompt("Enter current PIN:");
  if(oldPin === null) return;
  if(oldPin !== currentPin()){
    alert("Current PIN is incorrect.");
    return;
  }
  const newPin = prompt("Enter new PIN, minimum 4 digits:");
  if(!newPin) return;
  if(!/^\d{4,12}$/.test(newPin.trim())){
    alert("PIN must be 4 to 12 digits.");
    return;
  }
  localStorage.setItem("jsorderlit_pin", newPin.trim());
  alert("PIN updated successfully.");
}

}

function save(){localStorage.setItem("js_active",state.active);localStorage.setItem("js_projects",JSON.stringify(state.projects));localStorage.setItem("js_invoices",JSON.stringify(state.invoices));localStorage.setItem("js_receipts",JSON.stringify(state.receipts));localStorage.setItem("js_business",JSON.stringify(state.business));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function today(){return new Date().toISOString().slice(0,10);}
function num(v){return Number(v||0);}
function money(v){const c=state.business.currency||"IDR";const no=["IDR","JPY"].includes(c);const loc=c==="USD"?"en-US":c==="EUR"?"de-DE":c==="GBP"?"en-GB":c==="MYR"?"ms-MY":c==="SGD"?"en-SG":"id-ID";return new Intl.NumberFormat(loc,{style:"currency",currency:c,maximumFractionDigits:no?0:2}).format(num(v));}
function normalizeAuthors(v){if(Array.isArray(v))return v.map(a=>String(a||"").trim()).filter(Boolean);return String(v||"").split(/[,;]+/).map(a=>a.trim()).filter(Boolean);}
function authorsText(v){const a=normalizeAuthors(v);return a.length?a.join("; "):"-";}
function ensureProjectDefaults(p){p.projectCategory=p.projectCategory||p.category||"Journal Article";p.authors=normalizeAuthors(p.authors);p.price=num(p.price);return p;}
function formData(e){return Object.fromEntries(new FormData(e.target).entries());}
function val(o,k,d=""){return esc((o&&o[k]!=null&&o[k]!==undefined)?o[k]:d);}
function badge(v){let c="badge";if(["Paid","Completed","Accepted"].includes(v))c+=" green";else if(["Overdue","Rejected","Cancelled","Unpaid"].includes(v))c+=" red";else if(["Partially Paid","Revision","Under Review"].includes(v))c+=" amber";else c+=" blue";return `<span class="${c}">${esc(v||"-")}</span>`;}
function nextId(prefix,list){const y=new Date().getFullYear();const pref=`${prefix}-${y}-`;const nums=list.map(x=>String(x.id||"")).filter(id=>id.startsWith(pref)).map(id=>Number(id.split("-").pop())).filter(n=>!isNaN(n));return `${pref}${String(nums.length?Math.max(...nums)+1:1).padStart(3,"0")}`;}
function projectOrderId(dateStr){const d=dateStr?new Date(dateStr+"T00:00:00"):new Date();const m=d.getMonth()+1;const y=d.getFullYear();const pref=`JS-ORD-${m}-${y}-`;const nums=state.projects.map(p=>String(p.id||"")).filter(id=>id.startsWith(pref)).map(id=>Number(id.split("-").pop())).filter(n=>!isNaN(n));return `${pref}${String(nums.length?Math.max(...nums)+1:1).padStart(4,"0")}`;}
function refreshProjectIdByDate(input){const f=input.form;if(!f||!f.id)return;if(!f.id.value||/^JS-ORD-\d{1,2}-\d{4}-\d{4}$/.test(f.id.value))f.id.value=projectOrderId(input.value);}
function calcInvoice(i){return Math.max(0,num(i.amount)-num(i.discount)+num(i.tax));}

function masterIntegrateData(doSave=true){
  state.projects=state.projects.map(ensureProjectDefaults);
  const validProjects=new Set(state.projects.map(p=>p.id));
  const invMap={};
  for(const inv of state.invoices){
    if(!inv.projectId||!validProjects.has(inv.projectId))continue;
    if(!invMap[inv.projectId])invMap[inv.projectId]=Object.assign({},inv);
    else{
      const keep=invMap[inv.projectId];
      keep.amount=Math.max(num(keep.amount),num(inv.amount));
      keep.total=Math.max(num(keep.total),num(inv.total));
      keep.discount=num(keep.discount)||num(inv.discount);
      keep.tax=num(keep.tax)||num(inv.tax);
      keep.notes=[keep.notes,inv.notes].filter(Boolean).join(" | ");
    }
  }
  state.projects.forEach(p=>{
    const desc=`${p.projectCategory||"Journal Article"} - ${p.title||""}`;
    if(!invMap[p.id])invMap[p.id]={id:nextId("INV",Object.values(invMap)),projectId:p.id,issueDate:today(),dueDate:"",billTo:p.leadOrder||"",clientAddress:p.clientAddress||"",description:desc,amount:p.price||0,discount:0,tax:0,total:p.price||0,status:"Unpaid",notes:"Integrated master invoice"};
    const inv=invMap[p.id];
    inv.projectId=p.id; inv.billTo=p.leadOrder||inv.billTo||""; inv.clientAddress=p.clientAddress||inv.clientAddress||""; inv.description=desc;
    if(!num(inv.amount))inv.amount=num(p.price);
    inv.total=calcInvoice(inv);
  });
  state.invoices=Object.values(invMap).sort((a,b)=>String(b.id).localeCompare(String(a.id)));

  const recMap={};
  for(const r of state.receipts){
    if(!r.projectId||!validProjects.has(r.projectId))continue;
    const inv=state.invoices.find(i=>i.projectId===r.projectId);
    if(!recMap[r.projectId])recMap[r.projectId]=Object.assign({},r,{invoiceId:inv?inv.id:r.invoiceId});
    else{
      const keep=recMap[r.projectId];
      keep.amount=num(keep.amount)+num(r.amount);
      keep.notes=[keep.notes,r.notes].filter(Boolean).join(" | ");
      if(!keep.reference&&r.reference)keep.reference=r.reference;
      if(!keep.method&&r.method)keep.method=r.method;
    }
  }
  state.receipts=Object.values(recMap).sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  state.invoices.forEach(inv=>refreshInvoiceStatus(inv.id,false));
  if(doSave)save();
}
function projectInvoice(pid){return state.invoices.find(i=>i.projectId===pid);}
function projectReceipt(pid){return state.receipts.find(r=>r.projectId===pid);}
function projectInvoiceTotal(pid){const i=projectInvoice(pid);return i?num(i.total):0;}
function projectPaidTotal(pid){const r=projectReceipt(pid);return r?num(r.amount):0;}
function paymentStatus(pid){const inv=projectInvoiceTotal(pid),paid=projectPaidTotal(pid);if(inv<=0)return"Unpaid";if(paid>=inv)return"Paid";if(paid>0)return"Partially Paid";return"Unpaid";}
function refreshInvoiceStatus(invoiceId,doSave=true){const inv=state.invoices.find(i=>i.id===invoiceId);if(!inv)return;const paid=state.receipts.filter(r=>r.invoiceId===invoiceId).reduce((s,r)=>s+num(r.amount),0);inv.status=paid>=num(inv.total)?"Paid":paid>0?"Partially Paid":"Unpaid";if(doSave)save();}
function ensureProjectInvoice(p){masterIntegrateData(false);return projectInvoice(p.id);}
function ensureProjectReceipt(p){masterIntegrateData(false);let r=projectReceipt(p.id);if(!r){const inv=ensureProjectInvoice(p);r={id:nextId("RCP",state.receipts),projectId:p.id,invoiceId:inv.id,paymentDate:today(),paidBy:p.leadOrder||"",amount:0,method:"Bank Transfer",reference:"",receivedBy:state.business.ownerName,notes:""};state.receipts.unshift(r);save();}return r;}

function getReceipt(id){return state.receipts.find(r=>r.id===id);}
function deleteReceipt(id){if(!confirm("Delete receipt?"))return;state.receipts=state.receipts.filter(r=>r.id!==id);masterIntegrateData();render();}

function settingsPage(){const b=state.business;return`<div class="card pad"><h3 style="margin-top:0">Business Settings</h3><form class="form-grid" onsubmit="saveSettings(event)"><input name="businessName" value="${val(b,'businessName')}" placeholder="Business Name"><input name="headerTagline" value="${val(b,'headerTagline')}" placeholder="Header Tagline"><input name="ownerName" value="${val(b,'ownerName')}" placeholder="Owner Name"><input name="email" value="${val(b,'email')}" placeholder="Email"><input name="whatsapp" value="${val(b,'whatsapp')}" placeholder="WhatsApp"><select name="currency">${currencies.map(c=>`<option ${b.currency===c?'selected':''}>${c}</option>`).join("")}</select><input name="bankName" value="${val(b,'bankName')}" placeholder="Bank 1"><input name="accountNumber" value="${val(b,'accountNumber')}" placeholder="Account 1"><input name="bankName2" value="${val(b,'bankName2')}" placeholder="Bank 2"><input name="accountNumber2" value="${val(b,'accountNumber2')}" placeholder="Account 2"><textarea class="span2" name="address" placeholder="Address">${val(b,'address')}</textarea><div class="span2"><button class="btn">Save Settings</button> <button type="button" class="btn secondary" onclick="changePinPrompt()">Change PIN</button> <button type="button" class="btn secondary" onclick="repairIntegration()">Repair Integration</button></div></form></div>`;}
function saveSettings(e){e.preventDefault();state.business=Object.assign({},state.business,formData(e),{signatureImage:DEFAULT_SIGNATURE||state.business.signatureImage,headerTagline:"Professional Project Management"});save();alert("Settings saved.");render();}
function repairIntegration(){masterIntegrateData();alert("Project, invoice, and receipt records have been integrated and duplicates merged.");render();}

function drawerHTML(){if(!state.drawer)return"";const titles={project:"Project Order",invoice:"Integrated Invoice",receipt:"Integrated Receipt / Payment"};return`<div class="drawer-bg show"><div class="drawer"><div class="drawer-head"><div><h3>${state.editItem?"Edit":"Add"} ${titles[state.drawer]}</h3><p>One project is connected to one master invoice and one master receipt.</p></div><button class="btn secondary small" onclick="closeDrawer()">×</button></div><div class="drawer-body">${state.drawer==="project"?projectForm():state.drawer==="invoice"?invoiceForm():receiptForm()}</div></div></div>`;}
function projectForm(){const p=state.editItem||{};const d=val(p,"orderDate",today());return`<form class="form-grid" onsubmit="saveProjectForm(event)"><input name="id" value="${val(p,'id',projectOrderId(d))}" readonly><input name="orderDate" type="date" value="${d}" onchange="refreshProjectIdByDate(this)"><input class="span2" name="title" value="${val(p,'title')}" placeholder="Project / Manuscript / Editing Title" required><select name="projectCategory">${projectCategories.map(x=>`<option ${p.projectCategory===x?'selected':''}>${esc(x)}</option>`).join("")}</select><input name="leadOrder" value="${val(p,'leadOrder')}" placeholder="Lead Order / Client" required><input class="span2" name="clientAddress" value="${val(p,'clientAddress')}" placeholder="Client Address / Institution"><input name="correspondingAuthor" value="${val(p,'correspondingAuthor')}" placeholder="Corresponding Author / Contact"><input name="authors" value="${esc(authorsText(p.authors)==='-'?'':authorsText(p.authors))}" placeholder="Authors, separated by comma"><select name="scopusCategory">${scopusCategories.map(x=>`<option ${p.scopusCategory===x?'selected':''}>${x}</option>`).join("")}</select><input name="journal" value="${val(p,'journal')}" placeholder="Target Journal / Publisher / Service Note"><input name="price" type="number" value="${val(p,'price')}" placeholder="Project Fee"><select name="paymentTerm">${paymentTerms.map(x=>`<option ${p.paymentTerm===x?'selected':''}>${x}</option>`).join("")}</select><select name="status">${projectStatuses.map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join("")}</select><input name="deadline" type="date" value="${val(p,'deadline')}"><input name="resubmitTo" value="${val(p,'resubmitTo')}" placeholder="Resubmit To / Next Target"><textarea class="span2" name="notes" placeholder="Notes">${val(p,'notes')}</textarea><div class="span2 doc-meta-box"><div class="mini-label">Integrated Reference</div><p class="note"><strong>JS-ORD-MONTH-YEAR-SEQUENCE</strong>. Saving this project automatically syncs its invoice and receipt records.</p></div><div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Project</button></div></form>`;}
function invoiceForm(){const i=state.editItem||{};return`<form class="form-grid" onsubmit="saveInvoiceForm(event)"><input name="id" value="${val(i,'id',nextId('INV',state.invoices))}" readonly><select name="projectId" onchange="fillInvoiceProject(this.value,this.form)" required><option value="">Select Project</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${i.projectId===p.id?'selected':''}>${esc(p.id)} - ${esc(p.leadOrder||p.title)}</option>`).join("")}</select><input name="issueDate" type="date" value="${val(i,'issueDate',today())}"><input name="dueDate" type="date" value="${val(i,'dueDate')}"><input name="billTo" value="${val(i,'billTo')}" placeholder="Bill To"><input name="clientAddress" value="${val(i,'clientAddress')}" placeholder="Client Address"><input class="span2" name="description" value="${val(i,'description')}" placeholder="Description"><input name="amount" type="number" value="${val(i,'amount')}" placeholder="Amount"><input name="discount" type="number" value="${val(i,'discount',0)}" placeholder="Discount"><input name="tax" type="number" value="${val(i,'tax',0)}" placeholder="Tax/Admin"><select name="status"><option>Unpaid</option><option ${i.status==='Partially Paid'?'selected':''}>Partially Paid</option><option ${i.status==='Paid'?'selected':''}>Paid</option><option ${i.status==='Cancelled'?'selected':''}>Cancelled</option></select><textarea class="span2" name="notes" placeholder="Notes">${val(i,'notes')}</textarea><div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Integrated Invoice</button></div></form>`;}
function receiptForm(){const r=state.editItem||{};return`<form class="form-grid" onsubmit="saveReceiptForm(event)"><input name="id" value="${val(r,'id',nextId('RCP',state.receipts))}" readonly><select name="projectId" onchange="fillReceiptProject(this.value,this.form)" required><option value="">Select Project</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${r.projectId===p.id?'selected':''}>${esc(p.id)} - ${esc(p.leadOrder||p.title)}</option>`).join("")}</select><input name="invoiceId" value="${val(r,'invoiceId')}" readonly placeholder="Linked Invoice"><input name="paymentDate" type="date" value="${val(r,'paymentDate',today())}"><input name="paidBy" value="${val(r,'paidBy')}" placeholder="Paid By"><input name="amount" type="number" value="${val(r,'amount')}" placeholder="Amount"><input name="method" value="${val(r,'method','Bank Transfer')}" placeholder="Method"><input name="reference" value="${val(r,'reference')}" placeholder="Reference"><input name="receivedBy" value="${val(r,'receivedBy',state.business.ownerName)}" placeholder="Received By"><textarea class="span2" name="notes" placeholder="Notes">${val(r,'notes')}</textarea><div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Integrated Receipt</button></div></form>`;}
function fillInvoiceProject(id,f){const p=getProject(id);if(!p)return;const inv=ensureProjectInvoice(p);f.id.value=inv.id;f.billTo.value=p.leadOrder||"";f.clientAddress.value=p.clientAddress||"";f.description.value=`${p.projectCategory||"Journal Article"} - ${p.title||""}`;f.amount.value=inv.amount||p.price||0;f.discount.value=inv.discount||0;f.tax.value=inv.tax||0;}
function fillReceiptProject(id,f){const p=getProject(id);if(!p)return;const inv=ensureProjectInvoice(p);const rec=ensureProjectReceipt(p);f.id.value=rec.id;f.invoiceId.value=inv.id;f.paidBy.value=p.leadOrder||"";f.amount.value=rec.amount||0;}

function saveProjectForm(e){e.preventDefault();const x=ensureProjectDefaults(formData(e));if(!x.id)x.id=projectOrderId(x.orderDate);const ix=state.projects.findIndex(p=>p.id===x.id);if(ix>=0)state.projects[ix]=Object.assign({},state.projects[ix],x);else state.projects.unshift(x);masterIntegrateData();closeDrawer();}
function saveInvoiceForm(e){e.preventDefault();let x=formData(e);x.amount=num(x.amount);x.discount=num(x.discount);x.tax=num(x.tax);x.total=calcInvoice(x);const existing=projectInvoice(x.projectId);if(existing)x.id=existing.id;const ix=state.invoices.findIndex(i=>i.id===x.id);if(ix>=0)state.invoices[ix]=Object.assign({},state.invoices[ix],x);else state.invoices.unshift(x);masterIntegrateData(false);refreshInvoiceStatus(x.id,false);save();closeDrawer();}
function saveReceiptForm(e){e.preventDefault();let x=formData(e);x.amount=num(x.amount);const inv=projectInvoice(x.projectId);if(inv)x.invoiceId=inv.id;const existing=projectReceipt(x.projectId);if(existing)x.id=existing.id;const ix=state.receipts.findIndex(r=>r.id===x.id);if(ix>=0)state.receipts[ix]=Object.assign({},state.receipts[ix],x);else state.receipts.unshift(x);masterIntegrateData(false);if(x.invoiceId)refreshInvoiceStatus(x.invoiceId,false);save();closeDrawer();}
function quickInvoice(pid){const p=getProject(pid);if(!p)return;const inv=ensureProjectInvoice(p);save();openDrawer("invoice",inv);}
function quickReceipt(pid){const p=getProject(pid);if(!p)return;const rec=ensureProjectReceipt(p);save();openDrawer("receipt",rec);}

function downloadPDF(){const area=document.getElementById("printArea");if(!area){window.print();return}const title=(state.preview?.item?.id||"JSOrderLit-Document")+".pdf";if(window.html2pdf)html2pdf().set({margin:0,filename:title,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"pt",format:"a4",orientation:"portrait"}}).from(area).save();else window.print();}
function previewHTML(){if(!state.preview)return"";const type=state.preview.type;const item=state.preview.item;const p=getProject(item.projectId)||{};const isInv=type==="invoice";const title=isInv?"INVOICE":"OFFICIAL RECEIPT";const date=isInv?item.issueDate:item.paymentDate;const client=isInv?item.billTo:item.paidBy;const amount=isInv?item.total:item.amount;const stampLabel=isInv?"ISSUED":"PAID";const stampClass=isInv?"":" red";const stampDate=isInv?item.issueDate:item.paymentDate;const sig=DEFAULT_SIGNATURE||state.business.signatureImage;return`<div class="preview-bg show"><div class="preview-panel"><div class="preview-head"><div><h3 style="margin:0">${title} Preview</h3><p class="note" style="margin:0">Preview, print, download PDF, or close this document.</p></div><div><button class="btn secondary small" onclick="downloadPDF()">Download PDF</button> <button class="btn secondary small" onclick="window.print()">Print</button> <button class="btn secondary small" onclick="closePreview()">×</button></div></div><div id="printArea"><div class="doc"><div class="formal-top"></div><div class="watermark">${stampLabel}</div><div class="doc-head"><div class="header-flex"><div class="logo-print">JS</div><div><h2 style="margin:0">${esc(state.business.businessName)}</h2><p class="note" style="margin:4px 0 0">${esc(state.business.headerTagline)}</p><p class="note" style="margin:4px 0 0">WhatsApp: ${esc(state.business.whatsapp)} | Email: ${esc(state.business.email)}</p></div></div><div><div class="doc-title">${title}</div><div class="gold-line"></div><p class="note" style="text-align:right;margin:0">No: ${esc(item.id)}<br>Date: ${esc(date||"-")}</p></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="doc-meta-box"><div class="mini-label">Bill To / Client</div><h3 style="margin:6px 0">${esc(client||"-")}</h3><p class="note" style="margin:0">${esc(item.clientAddress||p.clientAddress||"-")}</p></div><div class="doc-meta-box"><div class="mini-label">Project Reference</div><h3 style="margin:6px 0">${esc(item.projectId||"-")}</h3><p class="note" style="margin:0">${esc(p.title||item.description||"-")}<br><strong>Category:</strong> ${esc(p.projectCategory||"Journal Article")}</p></div></div><div class="doc-table"><table><thead><tr><th>Description</th><th style="text-align:right">Amount (${esc(state.business.currency)})</th></tr></thead><tbody><tr><td>${isInv?esc(item.description):`Payment received via ${esc(item.method||"-")}, reference ${esc(item.reference||"-")}`}</td><td style="text-align:right"><strong>${money(amount)}</strong></td></tr>${isInv?`<tr><td style="text-align:right">Discount</td><td style="text-align:right">${money(item.discount)}</td></tr><tr><td style="text-align:right">Tax/Admin Fee</td><td style="text-align:right">${money(item.tax)}</td></tr>`:""}</tbody><tfoot><tr><td style="text-align:right">TOTAL</td><td style="text-align:right">${money(amount)}</td></tr></tfoot></table></div><div class="bank-box"><div class="mini-label">Bank Account & Payment Contact</div><p class="note" style="margin:6px 0 0"><strong>${esc(state.business.bankName)}:</strong> ${esc(state.business.accountNumber)} a.n. ${esc(state.business.accountHolder)}<br><strong>${esc(state.business.bankName2)}:</strong> ${esc(state.business.accountNumber2)} a.n. ${esc(state.business.accountHolder2)}<br><strong>WhatsApp Confirmation:</strong> ${esc(state.business.whatsapp)}</p></div><div class="approval-row"><div><small>Notes</small><p class="note">${esc(item.notes||"-")}</p></div><div class="approval-box"><div class="signature-stamp-wrap"><div class="stamp${stampClass}"><small>Official</small><strong>${stampLabel}</strong><span>${esc(stampDate||"")}</span></div><div class="signature-panel"><p class="note" style="margin-bottom:4px">Authorized Signature</p><img class="sig-img" src="${sig}" alt="Authorized Signature"><div class="signature-name">${esc(state.business.ownerName)}</div></div></div></div></div><div class="formal-footer"><span>${esc(state.business.businessName)}</span><span>${esc(state.business.email)} | ${esc(state.business.whatsapp)}</span></div></div></div></div></div>`;}
function render(){
  if(!isUnlocked){
    document.getElementById("app").innerHTML = pinScreen();
    setTimeout(() => {
      const input = document.getElementById("pinInput");
      if(input) input.focus();
    }, 50);
    return;
  }
  if(typeof masterIntegrateData === "function") masterIntegrateData(false);
  const content=state.active==="Dashboard"?dashboard():state.active==="Projects"?projectsPage():state.active==="Invoices"?invoicesPage():state.active==="Receipts"?receiptsPage():state.active==="Cashflow"?cashflowPage():settingsPage();
  document.getElementById("app").innerHTML=shell(content);
}
render();
</script>
</body>
</html>
