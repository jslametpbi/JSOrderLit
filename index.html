<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSOrderLit Manager</title>
  <meta name="description" content="Professional article project order, invoice, and receipt management system by Dr. Joko Slamet." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f1f5f9; color:#0f172a; }
    button, input, select, textarea { font: inherit; }
    .app { display:flex; min-height:100vh; }
    .sidebar { width:280px; background:#020617; color:#fff; padding:24px; position:sticky; top:0; height:100vh; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo { width:46px; height:46px; border-radius:18px; background:#fff; color:#020617; display:flex; align-items:center; justify-content:center; font-weight:900; }
    .brand h1 { margin:0; font-size:20px; }
    .brand p { margin:2px 0 0; color:#94a3b8; font-size:12px; }
    .nav button { width:100%; display:flex; align-items:center; gap:10px; padding:13px 15px; border:0; border-radius:18px; background:transparent; color:#cbd5e1; cursor:pointer; font-weight:700; margin-bottom:8px; text-align:left; }
    .nav button.active { background:#fff; color:#020617; }
    .profile { margin-top:26px; background:#0f172a; border:1px solid #1e293b; padding:16px; border-radius:20px; }
    .profile p { margin:3px 0; color:#94a3b8; font-size:12px; }
    .profile strong { color:#fff; }
    .main { flex:1; padding:30px; max-width:1500px; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:22px; }
    .pill { display:inline-flex; gap:8px; align-items:center; background:#fff; border:1px solid #e2e8f0; border-radius:999px; padding:9px 14px; color:#475569; font-size:13px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    h2.page { font-size:38px; margin:12px 0 6px; letter-spacing:-.04em; }
    .subtitle { margin:0; color:#64748b; max-width:850px; line-height:1.5; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
    .btn { border:0; background:#0f172a; color:#fff; padding:11px 16px; border-radius:16px; cursor:pointer; font-weight:800; display:inline-flex; gap:8px; align-items:center; }
    .btn.secondary { background:#fff; color:#0f172a; border:1px solid #e2e8f0; }
    .btn.danger { background:#fee2e2; color:#b91c1c; }
    .btn.small { padding:8px 10px; border-radius:12px; font-size:13px; }
    .grid4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:22px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    .card.pad { padding:22px; }
    .stat p { margin:0; color:#64748b; font-size:13px; }
    .stat h3 { margin:6px 0 4px; font-size:25px; }
    .stat small { color:#94a3b8; }
    .toolbar { display:grid; grid-template-columns:2fr 1fr 1fr; gap:14px; padding:18px; margin-bottom:20px; }
    input, select, textarea { width:100%; border:1px solid #e2e8f0; border-radius:16px; padding:12px 14px; outline:none; background:#fff; color:#0f172a; }
    textarea { min-height:96px; resize:vertical; }
    input:focus, select:focus, textarea:focus { border-color:#475569; box-shadow:0 0 0 3px rgba(71,85,105,.12); }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; background:#f8fafc; color:#475569; padding:15px; white-space:nowrap; font-weight:900; }
    td { padding:15px; border-top:1px solid #f1f5f9; vertical-align:top; color:#334155; }
    tr:hover td { background:#f8fafc; }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900; border:1px solid #e2e8f0; background:#f8fafc; }
    .badge.green { color:#047857; background:#ecfdf5; border-color:#a7f3d0; }
    .badge.red { color:#b91c1c; background:#fef2f2; border-color:#fecaca; }
    .badge.amber { color:#b45309; background:#fffbeb; border-color:#fde68a; }
    .badge.blue { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }
    .empty { border:1px dashed #cbd5e1; background:#f8fafc; border-radius:22px; padding:54px 20px; text-align:center; color:#64748b; }
    .empty strong { display:block; color:#0f172a; font-size:18px; margin-bottom:6px; }
    .drawer-bg { position:fixed; inset:0; background:rgba(2,6,23,.48); display:none; justify-content:flex-end; z-index:50; }
    .drawer-bg.show { display:flex; }
    .drawer { width:min(720px, 100%); background:#fff; min-height:100vh; overflow:auto; }
    .drawer-head { position:sticky; top:0; background:#fff; border-bottom:1px solid #e2e8f0; padding:20px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
    .drawer-head h3 { margin:0; font-size:22px; }
    .drawer-head p { margin:4px 0 0; color:#64748b; font-size:13px; }
    .drawer-body { padding:20px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .span2 { grid-column:span 2; }
    .doc { position:relative; background:#fff; border:1px solid #e2e8f0; border-radius:22px; padding:26px; overflow:hidden; }
    .doc-head { display:flex; justify-content:space-between; border-bottom:1px solid #e2e8f0; padding-bottom:18px; margin-bottom:18px; }
    .doc-title { font-size:32px; font-weight:950; }
    .note { color:#64748b; font-size:13px; line-height:1.5; }
    .stamp-wrap { position:absolute; right:26px; bottom:92px; }
    .stamp { width:128px; height:128px; border-radius:999px; border:5px double #0f766e; color:#0f766e; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; transform:rotate(-14deg); opacity:.92; background:rgba(255,255,255,.88); box-shadow:0 8px 24px rgba(15,23,42,.06); text-align:center; }
    .stamp.red { border-color:#b91c1c; color:#b91c1c; }
    .stamp small { display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
    .stamp strong { display:block; font-size:24px; line-height:1; margin:4px 0; }
    .stamp span { display:block; font-size:9px; letter-spacing:.1em; text-transform:uppercase; max-width:90px; }
    .watermark { position:absolute; inset:auto; top:42%; left:50%; transform:translate(-50%,-50%) rotate(-24deg); font-size:72px; font-weight:900; letter-spacing:.18em; color:rgba(15,23,42,.05); pointer-events:none; white-space:nowrap; user-select:none; }
    .doc-meta-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:18px; padding:14px 16px; }
    .footer-note { margin-top:22px; padding:15px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:18px; font-size:13px; }
    .logo-print { width:54px; height:54px; border-radius:18px; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; }
    .header-flex { display:flex; align-items:center; gap:14px; }
    .sig-img { width:180px; height:64px; object-fit:contain; display:block; margin-left:auto; }
    .a4-doc { width:794px; min-height:1123px; margin:0 auto; padding:0; background:#fff; }
    .formal-top { height:16px; background:linear-gradient(90deg,#0f172a 0%,#1d4ed8 58%,#f59e0b 58%,#f59e0b 100%); margin:-26px -26px 24px; }
    .formal-ribbon { display:inline-block; padding:7px 13px; border-radius:999px; background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8; font-size:11px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    .logo-img { width:62px; height:62px; border-radius:18px; object-fit:cover; border:1px solid #dbeafe; background:#fff; }
    .doc-table { border:1px solid #dbeafe; border-radius:16px; overflow:hidden; }
    .doc-table th { background:#0f172a; color:#fff; }
    .doc-table tfoot td { background:#eff6ff; color:#0f172a; font-size:16px; }
    .gold-line { height:3px; width:100%; background:linear-gradient(90deg,#1d4ed8,#f59e0b); margin:14px 0; border-radius:999px; }
    .formal-footer { position:absolute; left:26px; right:26px; bottom:22px; border-top:1px solid #e2e8f0; padding-top:10px; display:flex; justify-content:space-between; gap:20px; color:#64748b; font-size:11px; }
    .bank-box { margin-top:18px; padding:14px 16px; border:1px solid #e2e8f0; background:#f8fafc; border-radius:18px; }
    .contact-line { margin-top:6px; color:#475569; font-size:13px; }
    .mini-label { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.08em; font-weight:800; }

    @media (max-width: 980px) {
      .app { display:block; }
      .sidebar { width:auto; height:auto; position:relative; }
      .nav { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
      .grid4 { grid-template-columns:1fr 1fr; }
      .toolbar { grid-template-columns:1fr; }
      .topbar { flex-direction:column; }
    }
    @media (max-width: 640px) {
      .main { padding:18px; }
      .grid4 { grid-template-columns:1fr; }
      .form-grid { grid-template-columns:1fr; }
      .span2 { grid-column:span 1; }
      h2.page { font-size:30px; }
    }
    @media print {
      body * { visibility:hidden; }
      #printArea, #printArea * { visibility:visible; }
      #printArea { position:absolute; left:0; top:0; width:100%; padding:20px; }
      .no-print { display:none !important; }
    }
  
    .signature-panel { text-align:right; min-height:145px; }
    .sig-img { width:230px !important; height:92px !important; object-fit:contain; display:block; margin-left:auto; filter:contrast(1.18) saturate(1.05); }
    .signature-name { border-top:1px solid #0f172a; display:inline-block; min-width:230px; padding-top:7px; margin-top:4px; font-weight:900; color:#0f172a; }
    .stamp-wrap { margin:18px 0; display:flex; justify-content:flex-end; }
    .stamp { width:142px; height:142px; border:5px double #1d4ed8; border-radius:999px; color:#1d4ed8; transform:rotate(-8deg); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(255,255,255,.78); font-weight:950; letter-spacing:.04em; }
    .stamp.red { border-color:#dc2626; color:#dc2626; }
    .stamp small { font-size:12px; text-transform:uppercase; }
    .stamp strong { font-size:25px; line-height:1; margin:5px 0; }
    .stamp span { font-size:11px; }
    .doc { position:relative; padding-bottom:70px !important; }
    .doc-table table { border-collapse:collapse; width:100%; }
    .doc-table th, .doc-table td { padding:12px 14px; border-bottom:1px solid #e2e8f0; }
    .doc-meta-box { border:1px solid #dbeafe; border-radius:16px; padding:14px; background:#f8fbff; }

  </style>
</head>

function daysUntil(dateStr) {

  if(isNaN(d.getTime())) return null;

function nextSerialId(prefix, list, digits=3) {
  const year = new Date().getFullYear();
  const regex = new RegExp(`^${prefix}-${year}-(\\d+)$`);
  let max = 0;
  list.forEach(item => {
    const raw = item && item.id ? String(item.id) : "";
    const m = raw.match(regex);
    if (m) max = Math.max(max, Number(m[1] || 0));

  return `${prefix}-${year}-${String(max + 1).padStart(digits, "0")}`;
}

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120"><rect width="100%" height="100%" fill="white" fill-opacity="0"/><text x="180" y="72" text-anchor="middle" font-family="Brush Script MT, Segoe Script, cursive" font-size="40" fill="#0f172a">${safe}</text><path d="M70 86 C120 95, 235 95, 290 86" stroke="#94a3b8" stroke-width="2" fill="none"/></svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function projectOrderId(dateStr){
  const d = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
  const month = d.getMonth() + 1;
  const year = d.getFullYear();
  const prefix = `JS-ORD-${month}-${year}-`;
  const existing = (state.projects || [])
    .map(p => String(p.id || ""))
    .filter(id => id.startsWith(prefix))
    .map(id => Number(id.split("-").pop()))
    .filter(n => !isNaN(n));
  const next = existing.length ? Math.max(...existing) + 1 : 1;
  return `${prefix}${String(next).padStart(4, "0")}`;
}

function refreshProjectIdByDate(input){
  const form = input.form;
  if(!form || !form.id) return;
  const current = String(form.id.value || "");
  if(!current || /^JS-ORD-\d{1,2}-\d{4}-\d{4}$/.test(current)){
    form.id.value = projectOrderId(input.value);
  }
}

function logoData(textLogo) {

  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function badge(status) {
  let cls = "badge";
  if(["Accepted","Published","Completed","Paid"].includes(status)) cls += " green";
  else if(["Rejected","Overdue","Cancelled"].includes(status)) cls += " red";
  else if(["Under Review","Revision","Partially Paid"].includes(status)) cls += " amber";
  else if(["Submitted","Issued"].includes(status)) cls += " blue";
  return `<span class="${cls}">${esc(status)}</span>`;
}
function csvEscape(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
function exportCSV(name, rows) {
  if(!rows.length) { alert("No data to export."); return; }
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(","), ...rows.map(r => headers.map(h => csvEscape(Array.isArray(r[h]) ? r[h].join("; ") : r[h])).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}

function stats(){
  const totalProject = state.projects.reduce((s,p)=>s+Number(p.price||0),0);
  const invoiced = state.invoices.reduce((s,i)=>s+Number(i.total||0),0);
  const paid = state.receipts.reduce((s,r)=>s+Number(r.amount||0),0);
  return {totalProject, invoiced, paid, outstanding: invoiced-paid};
}
function filterProjects(){
  const q=state.query.toLowerCase();
  return state.projects.filter(p => {
    const text=[p.id,p.title,p.leadOrder,p.correspondingAuthor,p.targetJournal,p.journalType,p.status,...(p.authors||[])].join(" ").toLowerCase();
    return text.includes(q) && (state.statusFilter==="All" || p.status===state.statusFilter) && (state.journalFilter==="All" || p.journalType===state.journalFilter);
  });
}
function filterInvoices(){
  const q=state.query.toLowerCase();
  return state.invoices.filter(i => [i.id,i.projectId,i.billTo,i.description,i.status].join(" ").toLowerCase().includes(q));
}
function filterReceipts(){
  const q=state.query.toLowerCase();
  return state.receipts.filter(r => [r.id,r.invoiceId,r.projectId,r.paidBy,r.method,r.reference].join(" ").toLowerCase().includes(q));
}

function projectTable(rows, compact=false){
  if(!rows.length) return empty("No project orders found","There are no project orders yet or no data matches your filters.");
  return `<div class="card ${compact?'':'table-wrap'}"><div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Date</th><th>Project Details</th><th>Lead</th><th>Journal</th><th>Project Fee</th><th>Invoice & Receipt</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${rows.map(p=>{
    const projectInvoices = state.invoices.filter(i => i.projectId === p.id);
    const invoiced = projectInvoices.reduce((s,i)=>s+Number(i.total||0),0);
    const invoiceIds = projectInvoices.map(i=>i.id);
    const paid = state.receipts.filter(r => r.projectId === p.id || invoiceIds.includes(r.invoiceId)).reduce((s,r)=>s+Number(r.amount||0),0);
    const balance = invoiced > 0 ? invoiced - paid : Number(p.price||0) - paid;
    const payStatus = paid <= 0 ? "Unpaid" : balance > 0 ? "Partially Paid" : "Paid";
    return `<tr>
    <td><strong>${esc(p.id)}</strong></td>
    <td>${esc(p.orderDate)}${p.deadline?`<br><small>Due: ${esc(p.deadline)}</small>`:""}</td>
    <td><strong>${esc(p.title)}</strong><br><small>Authors: ${esc((p.authors||[]).join("; ")||"-")}</small><br><small>Corresponding: ${esc(p.correspondingAuthor||"-")}</small>${["Rejected","Resubmit"].includes(p.status)?`<br><small style="color:#b91c1c">Resubmit to: ${esc(p.resubmitTo||"not specified")}</small>`:""}</td>
    <td>${esc(p.leadOrder)}<br><small>${esc(p.paymentTerm)}</small></td>
    <td><strong>${esc(p.journalType)}</strong><br><small>${esc(p.targetJournal)}</small></td>
    <td><strong>${money(p.price)}</strong></td>
    <td>
      <strong>Invoiced: ${money(invoiced)}</strong><br>
      <small>Paid: ${money(paid)}</small><br>
      <small>Balance: ${money(balance)}</small><br>
      ${badge(payStatus)}
    </td>
    <td>${badge(p.status)}</td>
    <td>
      <button class="btn small secondary" onclick='quickInvoice("${esc(p.id)}")'>Invoice</button>
      <button class="btn small secondary" onclick='quickReceipt("${esc(p.id)}")'>Receipt</button>
      <button class="btn small secondary" onclick='openDrawer("project", ${JSON.stringify(p)})'>Edit</button>
      <button class="btn small danger" onclick='removeItem("projects","${esc(p.id)}")'>Delete</button>
    </td>
  </tr>`}).join("")}</tbody></table></div></div>`;
}

function fileToDataUrl(file, callback) {
  if(!file) { callback(""); return; }
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.readAsDataURL(file);
}

function saveBusinessSettingsWithFiles(form, data) {
  const logoFile = form.logoImageFile && form.logoImageFile.files ? form.logoImageFile.files[0] : null;
  const sigFile = form.signatureImageFile && form.signatureImageFile.files ? form.signatureImageFile.files[0] : null;
  fileToDataUrl(logoFile, (logoData) => {
    fileToDataUrl(sigFile, (sigData) => {
      if(logoData) data.logoImage = logoData;
      if(sigData) data.signatureImage = sigData;
      state.business = Object.assign({}, state.business, data, {_version: APP_VERSION});
      save();
      alert("Business profile, logo, signature, currency, bank, and reminder settings saved successfully.");
      render();
    });
  });
}

function saveBusinessSettings(e){
  e.preventDefault();
  const data = formData(e);
  delete data.logoImageFile;
  delete data.signatureImageFile;
  saveBusinessSettingsWithFiles(e.target, data);
}

    <textarea class="span2" name="notes" placeholder="Notes, service scope, revision plan, or special instruction">${val(p,'notes')}</textarea>
    <div class="span2 doc-meta-box">
      <div class="mini-label">Automatic Reference Format</div>
      <p class="note" style="margin:6px 0 0"><strong>JS-ORD-MONTH-YEAR-SEQUENCE</strong>, for example <strong>JS-ORD-6-2026-0003</strong> means the 3rd order in June 2026.</p>
    </div>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px">
      <button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button>
      <button class="btn">Save Project</button>
    </div>
  </form>`;
}

function invoiceForm(){
  const i=state.editItem||{};
  return `<form class="form-grid" onsubmit="saveInvoiceForm(event)">
    <input name="id" value="${val(i,'id',invoiceId())}" placeholder="Invoice Number" required>
    <select name="projectId" onchange="fillInvoiceProject(this.value)"><option value="">Select Project Order</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${i.projectId===p.id?'selected':''}>${esc(p.id)} - ${esc(p.title)}</option>`).join("")}</select>
    <input name="issueDate" type="date" value="${val(i,'issueDate',new Date().toISOString().slice(0,10))}">
    <input name="dueDate" type="date" value="${val(i,'dueDate')}">
    <input name="billTo" value="${val(i,'billTo')}" placeholder="Bill To / Client" required>
    <input name="clientAddress" value="${val(i,'clientAddress')}" placeholder="Client Address">
    <select name="status">${invoiceStatuses.map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join("")}</select>
    <textarea class="span2" name="description" placeholder="Invoice Description" required>${val(i,'description')}</textarea>
    <input name="amount" type="number" value="${val(i,'amount')}" placeholder="Amount" oninput="calcInvoiceTotal()">
    <input name="discount" type="number" value="${val(i,'discount')}" placeholder="Discount" oninput="calcInvoiceTotal()">
    <input name="tax" type="number" value="${val(i,'tax')}" placeholder="Tax / Admin Fee" oninput="calcInvoiceTotal()">
    <div class="card pad"><small>Invoice Total</small><h3 id="invoiceTotal">${money((Number(i.amount||0)-Number(i.discount||0)+Number(i.tax||0)))}</h3></div>
    <textarea class="span2" name="notes" placeholder="Invoice notes">${val(i,'notes')}</textarea>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Invoice</button></div>
  </form>`;
}
function receiptForm(){
  const r=state.editItem||{};
  return `<form class="form-grid" onsubmit="saveReceiptForm(event)">
    <input name="id" value="${val(r,'id',receiptId())}" placeholder="Receipt Number" required>
    <select name="invoiceId" onchange="fillReceiptInvoice(this.value)"><option value="">Select Invoice</option>${state.invoices.map(i=>`<option value="${esc(i.id)}" ${r.invoiceId===i.id?'selected':''}>${esc(i.id)} - ${esc(i.billTo)}</option>`).join("")}</select>
    <select name="projectId"><option value="">Select Project Order</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${r.projectId===p.id?'selected':''}>${esc(p.id)} - ${esc(p.title)}</option>`).join("")}</select>
    <input name="paymentDate" type="date" value="${val(r,'paymentDate',new Date().toISOString().slice(0,10))}">
    <input name="paidBy" value="${val(r,'paidBy')}" placeholder="Paid By" required>
    <input name="amount" type="number" value="${val(r,'amount')}" placeholder="Paid Amount" required>
    <select name="method">${receiptMethods.map(x=>`<option ${r.method===x?'selected':''}>${x}</option>`).join("")}</select>
    <input name="reference" value="${val(r,'reference')}" placeholder="Transfer Reference / Transaction ID">
    <input class="span2" name="receivedBy" value="${val(r,'receivedBy','Dr. Joko Slamet')}" placeholder="Received By">
    <textarea class="span2" name="notes" placeholder="Receipt notes">${val(r,'notes')}</textarea>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Receipt</button></div>
  </form>`;
}
function formData(e){ const fd=new FormData(e.target); return Object.fromEntries(fd.entries()); }
function saveProjectForm(e){
  e.preventDefault(); const x=formData(e); x.authors=(x.authors||"").split(",").map(a=>a.trim()).filter(Boolean); x.price=Number(x.price||0);
  const ix=state.projects.findIndex(p=>p.id===x.id); if(ix>=0) state.projects[ix]=x; else state.projects.unshift(x);
  save(); closeDrawer();
}

function normalizeProjectRecord(x){
  x.projectCategory = x.projectCategory || x.category || "Journal Article";
  x.price = Number(x.price || 0);
  return x;
}

function saveProjectForm(e){
  e.preventDefault();
  const x = normalizeProjectRecord(formData(e));
  if(!x.id) x.id = projectOrderId(x.orderDate);
  const i = state.projects.findIndex(p => p.id === x.id);
  if(i >= 0) state.projects[i] = Object.assign({}, state.projects[i], x);
  else state.projects.unshift(x);
  save();
  closeDrawer();
}

function saveInvoiceForm(e){
  e.preventDefault(); const x=formData(e); x.amount=Number(x.amount||0); x.discount=Number(x.discount||0); x.tax=Number(x.tax||0); x.total=x.amount-x.discount+x.tax;
  const ix=state.invoices.findIndex(i=>i.id===x.id); if(ix>=0) state.invoices[ix]=x; else state.invoices.unshift(x);
  save(); closeDrawer();
}
function saveReceiptForm(e){
  e.preventDefault(); const x=formData(e); x.amount=Number(x.amount||0);
  const inv=state.invoices.find(i=>i.id===x.invoiceId);
  if(inv && !x.projectId) x.projectId = inv.projectId || "";
  const ix=state.receipts.findIndex(r=>r.id===x.id); if(ix>=0) state.receipts[ix]=x; else state.receipts.unshift(x);
  if(inv){
    const paid=state.receipts.filter(r=>r.invoiceId===inv.id || (inv.projectId && r.projectId===inv.projectId)).reduce((s,r)=>s+Number(r.amount||0),0);
    inv.status = paid >= Number(inv.total||0) ? "Paid" : paid > 0 ? "Partially Paid" : inv.status;
  }
  save(); closeDrawer();
}
function fillInvoiceProject(pid){
  const p=state.projects.find(x=>x.id===pid); if(!p) return;
  const f=document.querySelector(".drawer form"); f.billTo.value=p.leadOrder||""; if(f.clientAddress) f.clientAddress.value=p.clientAddress||""; f.description.value=p.title||""; f.amount.value=p.price||0; calcInvoiceTotal();
}
function calcInvoiceTotal(){
  const f=document.querySelector(".drawer form"); if(!f) return;
  const total=Number(f.amount.value||0)-Number(f.discount.value||0)+Number(f.tax.value||0);
  const el=document.getElementById("invoiceTotal"); if(el) el.textContent=money(total);
}
function fillReceiptInvoice(iid){
  const inv=state.invoices.find(x=>x.id===iid); if(!inv) return;
  const f=document.querySelector(".drawer form"); f.projectId.value=inv.projectId||""; f.paidBy.value=inv.billTo||""; f.amount.value=inv.total||inv.amount||0;
}

function quickInvoice(projectId){
  const p = state.projects.find(x=>x.id===projectId);
  if(!p) return;
  const existing = state.invoices.find(i=>i.projectId===projectId);
  if(existing){
    openPreview("invoice", existing);
    return;
  }
  const inv = {
    id: invoiceId(),
    projectId: p.id,
    issueDate: new Date().toISOString().slice(0,10),
    dueDate: new Date(Date.now() + Number((state.business && state.business.dueSoonDays) || 7) * 86400000).toISOString().slice(0,10),
    billTo: p.leadOrder || "",
    clientAddress: p.clientAddress || "",
    description: `${p.projectCategory || "Journal Article"} - ${p.title || ""}`,
    amount: Number(p.price||0),
    discount: 0,
    tax: 0,
    total: Number(p.price||0),
    status: "Issued",
    notes: "Automatically generated from project order data."
  };
  state.invoices.unshift(inv);
  save();
  openPreview("invoice", inv);
}
function quickReceipt(projectId){
  const p = state.projects.find(x=>x.id===projectId);
  if(!p) return;
  const projectInvoices = state.invoices.filter(i=>i.projectId===projectId);
  let inv = projectInvoices[0];
  if(!inv){
    inv = {
      id: invoiceId(),
      projectId: p.id,
      issueDate: new Date().toISOString().slice(0,10),
      dueDate: new Date(Date.now() + Number((state.business && state.business.dueSoonDays) || 7) * 86400000).toISOString().slice(0,10),
      billTo: p.leadOrder || "",
      clientAddress: p.clientAddress || "",
      description: `${p.projectCategory || "Journal Article"} - ${p.title || ""}`,
      amount: Number(p.price||0),
      discount: 0,
      tax: 0,
      total: Number(p.price||0),
      status: "Issued",
      notes: "Automatically generated before receipt creation."
    };
    state.invoices.unshift(inv);
    save();
  }
  const paid = state.receipts.filter(r=>r.invoiceId===inv.id || r.projectId===projectId).reduce((s,r)=>s+Number(r.amount||0),0);
  const balance = Number(inv.total||0) - paid;
  state.editItem = {
    id: receiptId(),
    invoiceId: inv.id,
    projectId: p.id,
    paymentDate: new Date().toISOString().slice(0,10),
    paidBy: inv.billTo || p.leadOrder || "",
    amount: balance > 0 ? balance : Number(inv.total||p.price||0),
    method: "Bank Transfer",
    reference: "",
    receivedBy: "Dr. Joko Slamet",
    notes: "Payment recorded from project order data."
  };
  state.drawer = "receipt";
  render();
}


function downloadPreviewPDF(){
  if(!state.preview) return;
  const area = document.getElementById("printArea");
  if(!area || typeof html2pdf === "undefined"){
    alert("PDF library is loading. Please wait a moment and try again.");
    return;
  }
  const type = state.preview.type === "invoice" ? "Invoice" : "Receipt";
  const fileName = `${type}_${state.preview.item.id}.pdf`;
  const opt = {
    margin: 0,
    filename: fileName,
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: ["avoid-all", "css", "legacy"] }
  };
  html2pdf().set(opt).from(area).save();
}

function previewHTML(){
  if(!state.preview) return "";
  const {type,item}=state.preview;
  const project=state.projects.find(p=>p.id===item.projectId) || {};
  const title=type==="invoice"?"INVOICE":"OFFICIAL RECEIPT";
  const date=type==="invoice"?item.issueDate:item.paymentDate;
  const client=type==="invoice"?item.billTo:item.paidBy;
  const amount=type==="invoice"?item.total:item.amount;
  const clientAddress = item.clientAddress || project.clientAddress || "-";
  const stampLabel = type==="invoice" ? "ISSUED" : "PAID";
  const stampClass = type==="invoice" ? "" : " red";
  const watermark = type==="invoice" ? "INVOICE" : "PAID";
  const stampDate = type==="invoice" ? item.issueDate : item.paymentDate;
  const b = state.business || defaultBusiness;
  const logoHTML = `<img class="logo-img" src="${b.logoImage || logoData(b.logoText || "JS")}" alt="Company Logo" />`;
  const signatureHTML = `<img class="sig-img" src="${b.signatureImage || signatureData(b.signatureName || b.ownerName || "Dr. Joko Slamet")}" alt="Authorized Signature" />`;
  const dueInfo = type==="invoice" && item.dueDate ? `<br>Due Date: ${esc(item.dueDate)} ${dueBadge(item.dueDate, item.status)}` : "";
  return `<div class="drawer-bg show"><div class="drawer"><div class="drawer-head no-print"><div><h3>${title} Preview</h3><p>Formal A4 preview, print, download PDF, or close this document.</p></div><div><button class="btn secondary small" onclick="downloadPreviewPDF()">Download PDF</button> <button class="btn secondary small" onclick="window.print()">Print</button> <button class="btn secondary small" onclick="closePreview()">✕</button></div></div><div class="drawer-body"><div id="printArea"><div class="doc a4-doc">
    <div class="formal-top"></div>
    <div class="watermark">${watermark}</div>
    <div class="doc-head">
      <div class="header-flex">
        ${logoHTML}
        <div>
          <div class="formal-ribbon">${esc(b.headerTagline || "Professional Document")}</div>
          <h2 style="margin:8px 0 0;color:#0f172a">${esc(b.businessName || "JSOrderLit Manager")}</h2>
          <p class="note" style="margin:4px 0 0">${esc(b.address || "")}</p>
          <p class="contact-line">${b.whatsapp ? `WhatsApp: ${esc(b.whatsapp)}` : ""}${b.email ? `${b.whatsapp ? " | " : ""}Email: ${esc(b.email)}` : ""}</p>
        </div>
      </div>
      <div style="text-align:right">
        <div class="doc-title" style="color:#1d4ed8">${title}</div>
        <div class="gold-line"></div>
        <div class="doc-meta-box">
          <p class="note" style="margin:0">No: ${esc(item.id)}<br>Date: ${esc(date)}${dueInfo}</p>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px">
      <div class="doc-meta-box">
        <div class="mini-label">Bill To / Client</div>
        <h3 style="margin:6px 0 0">${esc(client)}</h3>
        <p class="note" style="margin:6px 0 0">${esc(clientAddress)}</p>
      </div>
      <div class="doc-meta-box">
        <div class="mini-label">Project Reference</div>
        <h3 style="margin:6px 0 0">${esc(item.projectId||"-")}</h3>
        <p class="note" style="margin:6px 0 0">${esc(project.title||item.description||"-")}<br><strong>Category:</strong> ${esc(project.projectCategory || "Journal Article")}</p>
      </div>
    </div>

    <div class="doc-table">
      <table>
        <thead><tr><th>Description</th><th style="text-align:right">Amount (${esc(activeCurrency())})</th></tr></thead>
        <tbody>
          <tr><td>${type==="invoice"?esc(item.description):`Payment received via ${esc(item.method)} ${item.reference?`, reference ${esc(item.reference)}`:""}`}</td><td style="text-align:right"><strong>${money(amount)}</strong></td></tr>
          ${type==="invoice"?`<tr><td style="text-align:right">Discount</td><td style="text-align:right">${money(item.discount)}</td></tr><tr><td style="text-align:right">Tax/Admin Fee</td><td style="text-align:right">${money(item.tax)}</td></tr>`:""}
        </tbody>
        <tfoot><tr><td style="text-align:right"><strong>TOTAL</strong></td><td style="text-align:right"><strong>${money(amount)}</strong></td></tr></tfoot>
      </table>
    </div>

    <div class="bank-box">
      <div class="mini-label">Bank Account & Payment Contact</div>
      <p class="note" style="margin:6px 0 0">
        <strong>${esc(b.bankName || "Bank")}:</strong> ${esc(b.accountNumber || "-")} a.n. ${esc(b.accountHolder || "-")}<br>
        <strong>${esc(b.bankName2 || "Bank 2")}:</strong> ${esc(b.accountNumber2 || "-")} a.n. ${esc(b.accountHolder2 || "-")}<br>
        ${b.whatsapp ? `<strong>WhatsApp Confirmation:</strong> ${esc(b.whatsapp)}` : ""}
      </p>
    </div>

    <div class="stamp-wrap">
      <div class="stamp${stampClass}">
        <small>Official</small>
        <strong>${stampLabel}</strong>
        <span>${esc(stampDate || "")}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px">
      <div>
        <small>Notes</small>
        <p class="note">${esc(item.notes||"-")}</p>
      </div>
      <div class="signature-panel">
        <p class="note" style="margin-bottom:8px">Authorized Signature</p>
        ${signatureHTML}
        <div class="signature-name">${esc(b.ownerName || "Dr. Joko Slamet")}</div>
      </div>
    </div>
    <div class="formal-footer">
      <span>${esc(b.businessName || "JSOrderLit Manager")}</span>
      <span>${esc(b.email || "")}${b.whatsapp ? " | " + esc(b.whatsapp) : ""}</span>
    </div>
  </div></div></div></div>`;
}
function render(){
  let content = state.active==="Dashboard" ? dashboard() : state.active==="Projects" ? projectsPage() : state.active==="Invoices" ? invoicesPage() : state.active==="Receipts" ? receiptsPage() : settingsPage();
  document.getElementById("app").innerHTML = shell(content);
}
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(()=>{});
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
