function receiptForm(){let p=state.edit||state.projects[0];if(!p)return '<div class="empty"><b>No project</b></div>';let r=p.receipt;return `<form class="fg" onsubmit="saveReceipt(event)"><input name="projectId" value="${esc(p.id)}" readonly><input name="id" value="${val(r,'id')}" readonly><input name="invoiceId" value="${val(r,'invoiceId')}" readonly><input name="paymentDate" type="date" value="${val(r,'paymentDate',today())}"><input name="paidBy" value="${val(r,'paidBy')}"><input name="amount" type="number" value="${val(r,'amount')}"><input name="method" value="${val(r,'method','Bank Transfer')}"><input name="reference" value="${val(r,'reference')}"><input name="receivedBy" value="${val(r,'receivedBy',state.business.ownerName)}"><textarea class="span2" name="notes">${val(r,'notes')}</textarea><div class="span2 box"><p class="note">Saving receipt updates invoice status and monthly cashflow immediately.</p></div><div class="span2" style="text-align:right"><button type="button" class="btn sec" onclick="closeD()">Cancel</button> <button class="btn">Save Integrated Receipt</button></div></form>`}
function nested(o,k,v){if(k.includes('.')){let[a,b]=k.split('.');o[a]=o[a]||{};o[a][b]=v}else o[k]=v}function saveProject(e){e.preventDefault();let raw=fd(e),x={};Object.entries(raw).forEach(([k,v])=>nested(x,k,v));x.authors=auth(x.authors);x.price=num(x.price);let ix=state.projects.findIndex(p=>p.id===x.id);if(ix>=0){let old=state.projects[ix];x.invoice=old.invoice;x.receipt=old.receipt;state.projects[ix]=norm(Object.assign(old,x))}else state.projects.unshift(norm(x));save();closeD()}function saveInvoice(e){e.preventDefault();let x=fd(e),p=getP(x.projectId);if(!p)return;p.invoice=Object.assign(p.invoice,x);p.invoice.amount=num(p.invoice.amount);p.invoice.discount=num(p.invoice.discount);p.invoice.tax=num(p.invoice.tax);p.invoice.total=calc(p.invoice);norm(p);save();closeD()}function saveReceipt(e){e.preventDefault();let x=fd(e),p=getP(x.projectId);if(!p)return;p.receipt=Object.assign(p.receipt,x);p.receipt.amount=num(p.receipt.amount);norm(p);save();closeD()}
function downloadPDF(){let area=document.getElementById('printArea');if(!area){window.print();return}let title=(state.preview?.item?.invoice?.id||state.preview?.item?.receipt?.id||'JSOrderLit')+'.pdf';if(window.html2pdf)html2pdf().set({margin:0,filename:title,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'pt',format:'a4',orientation:'portrait'}}).from(area).save();else window.print()}function preview(){if(!state.preview)return'';let type=state.preview.type,p=state.preview.item,item=type==='invoice'?p.invoice:p.receipt,isInv=type==='invoice',title=isInv?'INVOICE':'OFFICIAL RECEIPT',date=isInv?item.issueDate:item.paymentDate,client=isInv?item.billTo:item.paidBy,amount=isInv?item.total:item.amount,stamp=isInv?'ISSUED':'PAID';return `<div class="prevbg show"><div class="prev"><div class="dh"><div><h3>${title} Preview</h3><p class="note">Preview, print, download PDF, or close.</p></div><div><button class="btn sec sm" onclick="downloadPDF()">Download PDF</button> <button class="btn sec sm" onclick="window.print()">Print</button> <button class="btn sec sm" onclick="closePrev()">×</button></div></div><div id="printArea"><div class="doc"><div class="formal"></div><div class="dochead"><div style="display:flex;gap:14px;align-items:center"><div class="doclogo">JS</div><div><h2 style="margin:0">${esc(state.business.businessName)}</h2><p class="note">${esc(state.business.headerTagline)}<br>WhatsApp: ${esc(state.business.whatsapp)} | Email: ${esc(state.business.email)}</p></div></div><div><div class="doctitle">${title}</div><div class="line"></div><p class="note" style="text-align:right">No: ${esc(item.id)}<br>Date: ${esc(date||'-')}</p></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="box"><b>Bill To / Client</b><h3>${esc(client||'-')}</h3><p class="note">${esc(item.clientAddress||p.clientAddress||'-')}</p></div><div class="box"><b>Project Reference</b><h3>${esc(p.id)}</h3><p class="note">${esc(p.title)}<br><b>Category:</b> ${esc(p.projectCategory)}</p></div></div><div class="doc-table table" style="margin-top:18px"><table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr><td>${isInv?esc(item.description):`Payment received via ${esc(item.method||'-')}, reference ${esc(item.reference||'-')}`}</td><td style="text-align:right"><b>${money(amount)}</b></td></tr></tbody><tfoot><tr><td style="text-align:right"><b>TOTAL</b></td><td style="text-align:right"><b>${money(amount)}</b></td></tr></tfoot></table></div><div class="box" style="margin-top:18px"><b>Bank Account & Payment Contact</b><p class="note"><b>${esc(state.business.bankName)}:</b> ${esc(state.business.accountNumber)} a.n. ${esc(state.business.accountHolder)}<br><b>${esc(state.business.bankName2)}:</b> ${esc(state.business.accountNumber2)} a.n. ${esc(state.business.accountHolder2)}<br><b>WhatsApp:</b> ${esc(state.business.whatsapp)}</p></div><div class="approval-row"><div><small>Notes</small><p class="note">${esc(item.notes||'-')}</p></div><div class="approval-box"><div class="stampwrap"><div class="stamp"><div><small>Official</small><br><b>${stamp}</b><br><small>${esc(date||'')}</small></div></div><div class="sigpanel"><p class="note">Authorized Signature</p><img class="sig" src="${SIG||state.business.signatureImage}"><div class="sigline">${esc(state.business.ownerName)}</div></div></div></div></div><div class="footer"><span>${esc(state.business.businessName)}</span><span>${esc(state.business.email)} | ${esc(state.business.whatsapp)}</span></div></div></div></div></div>`}
function render(){if(!unlocked){document.getElementById('app').innerHTML=pinScreen();setTimeout(()=>{let i=document.getElementById('pinInput');if(i)i.focus()},50);return}state.projects=state.projects.map(norm);let c=state.active==='Dashboard'?dashboard():state.active==='Projects'?projectsPage():state.active==='Invoices'?invoicesPage():state.active==='Receipts'?receiptsPage():state.active==='Cashflow'?cashflowPage():settingsPage();document.getElementById('app').innerHTML=shell(c)}render();
</script></body></html>
