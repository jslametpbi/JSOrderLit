<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSOrderLit Manager</title>
  <meta name="description" content="Professional article project order, invoice, and receipt management system by Dr. Joko Slamet." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f1f5f9; color:#0f172a; }
    button, input, select, textarea { font: inherit; }
    .app { display:flex; min-height:100vh; }
    .sidebar { width:280px; background:#020617; color:#fff; padding:24px; position:sticky; top:0; height:100vh; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo { width:46px; height:46px; border-radius:18px; background:#fff; color:#020617; display:flex; align-items:center; justify-content:center; font-weight:900; }
    .brand h1 { margin:0; font-size:20px; }
    .brand p { margin:2px 0 0; color:#94a3b8; font-size:12px; }
    .nav button { width:100%; display:flex; align-items:center; gap:10px; padding:13px 15px; border:0; border-radius:18px; background:transparent; color:#cbd5e1; cursor:pointer; font-weight:700; margin-bottom:8px; text-align:left; }
    .nav button.active { background:#fff; color:#020617; }
    .profile { margin-top:26px; background:#0f172a; border:1px solid #1e293b; padding:16px; border-radius:20px; }
    .profile p { margin:3px 0; color:#94a3b8; font-size:12px; }
    .profile strong { color:#fff; }
    .main { flex:1; padding:30px; max-width:1500px; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:22px; }
    .pill { display:inline-flex; gap:8px; align-items:center; background:#fff; border:1px solid #e2e8f0; border-radius:999px; padding:9px 14px; color:#475569; font-size:13px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    h2.page { font-size:38px; margin:12px 0 6px; letter-spacing:-.04em; }
    .subtitle { margin:0; color:#64748b; max-width:850px; line-height:1.5; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
    .btn { border:0; background:#0f172a; color:#fff; padding:11px 16px; border-radius:16px; cursor:pointer; font-weight:800; display:inline-flex; gap:8px; align-items:center; }
    .btn.secondary { background:#fff; color:#0f172a; border:1px solid #e2e8f0; }
    .btn.danger { background:#fee2e2; color:#b91c1c; }
    .btn.small { padding:8px 10px; border-radius:12px; font-size:13px; }
    .grid4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:22px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    .card.pad { padding:22px; }
    .stat p { margin:0; color:#64748b; font-size:13px; }
    .stat h3 { margin:6px 0 4px; font-size:25px; }
    .stat small { color:#94a3b8; }
    .toolbar { display:grid; grid-template-columns:2fr 1fr 1fr; gap:14px; padding:18px; margin-bottom:20px; }
    input, select, textarea { width:100%; border:1px solid #e2e8f0; border-radius:16px; padding:12px 14px; outline:none; background:#fff; color:#0f172a; }
    textarea { min-height:96px; resize:vertical; }
    input:focus, select:focus, textarea:focus { border-color:#475569; box-shadow:0 0 0 3px rgba(71,85,105,.12); }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; background:#f8fafc; color:#475569; padding:15px; white-space:nowrap; font-weight:900; }
    td { padding:15px; border-top:1px solid #f1f5f9; vertical-align:top; color:#334155; }
    tr:hover td { background:#f8fafc; }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900; border:1px solid #e2e8f0; background:#f8fafc; }
    .badge.green { color:#047857; background:#ecfdf5; border-color:#a7f3d0; }
    .badge.red { color:#b91c1c; background:#fef2f2; border-color:#fecaca; }
    .badge.amber { color:#b45309; background:#fffbeb; border-color:#fde68a; }
    .badge.blue { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }
    .empty { border:1px dashed #cbd5e1; background:#f8fafc; border-radius:22px; padding:54px 20px; text-align:center; color:#64748b; }
    .empty strong { display:block; color:#0f172a; font-size:18px; margin-bottom:6px; }
    .drawer-bg { position:fixed; inset:0; background:rgba(2,6,23,.48); display:none; justify-content:flex-end; z-index:50; }
    .drawer-bg.show { display:flex; }
    .drawer { width:min(720px, 100%); background:#fff; min-height:100vh; overflow:auto; }
    .drawer-head { position:sticky; top:0; background:#fff; border-bottom:1px solid #e2e8f0; padding:20px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
    .drawer-head h3 { margin:0; font-size:22px; }
    .drawer-head p { margin:4px 0 0; color:#64748b; font-size:13px; }
    .drawer-body { padding:20px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .span2 { grid-column:span 2; }
    .doc { background:#fff; border:1px solid #e2e8f0; border-radius:22px; padding:26px; }
    .doc-head { display:flex; justify-content:space-between; border-bottom:1px solid #e2e8f0; padding-bottom:18px; margin-bottom:18px; }
    .doc-title { font-size:32px; font-weight:950; }
    .note { color:#64748b; font-size:13px; line-height:1.5; }
    .footer-note { margin-top:22px; padding:15px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:18px; font-size:13px; }
    @media (max-width: 980px) {
      .app { display:block; }
      .sidebar { width:auto; height:auto; position:relative; }
      .nav { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
      .grid4 { grid-template-columns:1fr 1fr; }
      .toolbar { grid-template-columns:1fr; }
      .topbar { flex-direction:column; }
    }
    @media (max-width: 640px) {
      .main { padding:18px; }
      .grid4 { grid-template-columns:1fr; }
      .form-grid { grid-template-columns:1fr; }
      .span2 { grid-column:span 1; }
      h2.page { font-size:30px; }
    }
    @media print {
      body * { visibility:hidden; }
      #printArea, #printArea * { visibility:visible; }
      #printArea { position:absolute; left:0; top:0; width:100%; padding:20px; }
      .no-print { display:none !important; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const state = {
  active: localStorage.getItem("js_active") || "Dashboard",
  projects: JSON.parse(localStorage.getItem("js_projects") || "[]"),
  invoices: JSON.parse(localStorage.getItem("js_invoices") || "[]"),
  receipts: JSON.parse(localStorage.getItem("js_receipts") || "[]"),
  query: "",
  statusFilter: "All",
  journalFilter: "All",
  drawer: null,
  editItem: null,
  preview: null
};

const journalTypes = ["Scopus Q1","Scopus Q2","Scopus Q3","Scopus Q4","Non Scopus"];
const projectStatuses = ["Draft","Submitted","Under Review","Revision","Rejected","Resubmit","Accepted","Published","Completed"];
const invoiceStatuses = ["Draft","Issued","Partially Paid","Paid","Overdue","Cancelled"];
const paymentTerms = ["Full","50%","Installment","Custom","Unpaid"];
const receiptMethods = ["Bank Transfer","Cash","E-Wallet","Virtual Account","Other"];

function save() {
  localStorage.setItem("js_projects", JSON.stringify(state.projects));
  localStorage.setItem("js_invoices", JSON.stringify(state.invoices));
  localStorage.setItem("js_receipts", JSON.stringify(state.receipts));
  localStorage.setItem("js_active", state.active);
}
function money(v) { return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v||0)); }
function id(prefix, arr) { return `${prefix}-${new Date().getFullYear()}-${String(arr.length+1).padStart(4,"0")}`; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function badge(status) {
  let cls = "badge";
  if(["Accepted","Published","Completed","Paid"].includes(status)) cls += " green";
  else if(["Rejected","Overdue","Cancelled"].includes(status)) cls += " red";
  else if(["Under Review","Revision","Partially Paid"].includes(status)) cls += " amber";
  else if(["Submitted","Issued"].includes(status)) cls += " blue";
  return `<span class="${cls}">${esc(status)}</span>`;
}
function csvEscape(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
function exportCSV(name, rows) {
  if(!rows.length) { alert("No data to export."); return; }
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(","), ...rows.map(r => headers.map(h => csvEscape(Array.isArray(r[h]) ? r[h].join("; ") : r[h])).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}
function setActive(x){ state.active=x; save(); render(); }
function openDrawer(type, item=null){ state.drawer=type; state.editItem=item; render(); }
function closeDrawer(){ state.drawer=null; state.editItem=null; render(); }
function openPreview(type,item){ state.preview={type,item}; render(); }
function closePreview(){ state.preview=null; render(); }
function removeItem(kind, idv){
  if(!confirm("Delete this data?")) return;
  state[kind] = state[kind].filter(x => x.id !== idv);
  save(); render();
}

function stats(){
  const totalProject = state.projects.reduce((s,p)=>s+Number(p.price||0),0);
  const invoiced = state.invoices.reduce((s,i)=>s+Number(i.total||0),0);
  const paid = state.receipts.reduce((s,r)=>s+Number(r.amount||0),0);
  return {totalProject, invoiced, paid, outstanding: invoiced-paid};
}
function filterProjects(){
  const q=state.query.toLowerCase();
  return state.projects.filter(p => {
    const text=[p.id,p.title,p.leadOrder,p.correspondingAuthor,p.targetJournal,p.journalType,p.status,...(p.authors||[])].join(" ").toLowerCase();
    return text.includes(q) && (state.statusFilter==="All" || p.status===state.statusFilter) && (state.journalFilter==="All" || p.journalType===state.journalFilter);
  });
}
function filterInvoices(){
  const q=state.query.toLowerCase();
  return state.invoices.filter(i => [i.id,i.projectId,i.billTo,i.description,i.status].join(" ").toLowerCase().includes(q));
}
function filterReceipts(){
  const q=state.query.toLowerCase();
  return state.receipts.filter(r => [r.id,r.invoiceId,r.projectId,r.paidBy,r.method,r.reference].join(" ").toLowerCase().includes(q));
}

function shell(content){
  const s = stats();
  return `
  <div class="app">
    <aside class="sidebar no-print">
      <div class="brand"><div class="logo">JS</div><div><h1>JSOrderLit</h1><p>Article Order System</p></div></div>
      <div class="nav">
        ${["Dashboard","Projects","Invoices","Receipts","Settings"].map(x=>`<button class="${state.active===x?'active':''}" onclick="setActive('${x}')">${icon(x)} ${x}</button>`).join("")}
      </div>
      <div class="profile"><p>System Owner</p><strong>Dr. Joko Slamet</strong><p>Cipta Wacana University</p></div>
    </aside>
    <main class="main">
      <div class="topbar no-print">
        <div>
          <div class="pill">📚 Professional Article Project Order Management</div>
          <h2 class="page">${state.active}</h2>
          <p class="subtitle">Manage article orders, authorship, target journals, Scopus categories, fees, invoices, receipts, submission status, rejection, and resubmission workflow in one integrated system.</p>
        </div>
        <div class="actions">
          <button class="btn secondary" onclick='exportCSV("projects.csv", state.projects)'>⬇ Export Projects</button>
          <button class="btn secondary" onclick='exportCSV("invoices.csv", state.invoices)'>⬇ Export Invoices</button>
          <button class="btn" onclick="openDrawer('project')">＋ New Project</button>
        </div>
      </div>
      <div class="grid4 no-print">
        ${stat("Project Orders", state.projects.length, "Total article projects recorded")}
        ${stat("Project Value", money(s.totalProject), "Estimated total service value")}
        ${stat("Invoiced", money(s.invoiced), "Total invoice value issued")}
        ${stat("Received", money(s.paid), "Outstanding: "+money(s.outstanding))}
      </div>
      ${content}
    </main>
  </div>
  ${drawerHTML()}
  ${previewHTML()}
  `;
}
function icon(x){
  return ({Dashboard:"⌂",Projects:"▣",Invoices:"▤",Receipts:"▥",Settings:"⚙"})[x] || "•";
}
function stat(t,v,sub){ return `<div class="card pad stat"><p>${t}</p><h3>${v}</h3><small>${sub}</small></div>`; }
function empty(title, desc){ return `<div class="empty"><strong>${title}</strong>${desc}</div>`; }
function toolbar(){
  return `<div class="card toolbar no-print">
    <input value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="Search data by ID, title, author, journal, client, invoice, or receipt" />
    <select onchange="state.statusFilter=this.value;render()"><option>All</option>${projectStatuses.map(x=>`<option ${state.statusFilter===x?'selected':''}>${x}</option>`).join("")}</select>
    <select onchange="state.journalFilter=this.value;render()"><option>All</option>${journalTypes.map(x=>`<option ${state.journalFilter===x?'selected':''}>${x}</option>`).join("")}</select>
  </div>`;
}
function dashboard(){
  const recent = filterProjects().slice(0,5);
  return `<div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
    <div class="card pad">
      <h3 style="margin-top:0">Operational Overview</h3>
      ${recent.length?projectTable(recent,true):empty("No project order has been added","Start by creating your first article project order. The dashboard will update automatically.")}
    </div>
    <div class="card pad">
      <h3 style="margin-top:0">Fast Actions</h3>
      <button class="btn" style="width:100%;justify-content:flex-start;margin-bottom:10px" onclick="openDrawer('project')">＋ Add Project Order</button>
      <button class="btn secondary" style="width:100%;justify-content:flex-start;margin-bottom:10px" onclick="openDrawer('invoice')">▤ Create Invoice</button>
      <button class="btn secondary" style="width:100%;justify-content:flex-start" onclick="openDrawer('receipt')">▥ Create Receipt</button>
      <div class="footer-note">This no-API-key version stores data permanently in your browser using localStorage. For multi-device/team access, connect a database later.</div>
    </div>
  </div>`;
}
function projectTable(rows, compact=false){
  if(!rows.length) return empty("No project orders found","There are no project orders yet or no data matches your filters.");
  return `<div class="card ${compact?'':'table-wrap'}"><div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Date</th><th>Project Details</th><th>Lead</th><th>Journal</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${rows.map(p=>`<tr>
    <td><strong>${esc(p.id)}</strong></td>
    <td>${esc(p.orderDate)}${p.deadline?`<br><small>Due: ${esc(p.deadline)}</small>`:""}</td>
    <td><strong>${esc(p.title)}</strong><br><small>Authors: ${esc((p.authors||[]).join("; ")||"-")}</small><br><small>Corresponding: ${esc(p.correspondingAuthor||"-")}</small>${["Rejected","Resubmit"].includes(p.status)?`<br><small style="color:#b91c1c">Resubmit to: ${esc(p.resubmitTo||"not specified")}</small>`:""}</td>
    <td>${esc(p.leadOrder)}<br><small>${esc(p.paymentTerm)}</small></td>
    <td><strong>${esc(p.journalType)}</strong><br><small>${esc(p.targetJournal)}</small></td>
    <td><strong>${money(p.price)}</strong></td>
    <td>${badge(p.status)}</td>
    <td><button class="btn small secondary" onclick='openDrawer("project", ${JSON.stringify(p)})'>Edit</button> <button class="btn small danger" onclick='removeItem("projects","${esc(p.id)}")'>Delete</button></td>
  </tr>`).join("")}</tbody></table></div></div>`;
}
function projectsPage(){ return toolbar()+projectTable(filterProjects()); }

function invoicesPage(){
  const rows=filterInvoices();
  return `<div class="card pad no-print" style="margin-bottom:20px;display:flex;gap:12px;justify-content:space-between;align-items:center">
    <input style="max-width:520px" value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="Search invoice" />
    <button class="btn" onclick="openDrawer('invoice')">＋ New Invoice</button>
  </div>
  ${rows.length?`<div class="card table-wrap"><table><thead><tr><th>Invoice</th><th>Dates</th><th>Client</th><th>Project</th><th>Total</th><th>Paid</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(i=>{
    const paid=state.receipts.filter(r=>r.invoiceId===i.id).reduce((s,r)=>s+Number(r.amount||0),0);
    return `<tr><td><strong>${esc(i.id)}</strong></td><td>Issued: ${esc(i.issueDate)}<br><small>Due: ${esc(i.dueDate||"-")}</small></td><td><strong>${esc(i.billTo)}</strong></td><td>${esc(i.projectId||"-")}<br><small>${esc(i.description)}</small></td><td><strong>${money(i.total)}</strong></td><td>${money(paid)}</td><td>${badge(i.status)}</td><td><button class="btn small secondary" onclick='openPreview("invoice", ${JSON.stringify(i)})'>View</button> <button class="btn small secondary" onclick='openDrawer("invoice", ${JSON.stringify(i)})'>Edit</button> <button class="btn small danger" onclick='removeItem("invoices","${esc(i.id)}")'>Delete</button></td></tr>`
  }).join("")}</tbody></table></div>`:empty("No invoices yet","Create your first invoice or adjust your search keyword.")}`;
}
function receiptsPage(){
  const rows=filterReceipts();
  return `<div class="card pad no-print" style="margin-bottom:20px;display:flex;gap:12px;justify-content:space-between;align-items:center">
    <input style="max-width:520px" value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="Search receipt" />
    <button class="btn" onclick="openDrawer('receipt')">＋ New Receipt</button>
  </div>
  ${rows.length?`<div class="card table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Paid By</th><th>Linked Invoice</th><th>Method</th><th>Amount</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.id)}</strong></td><td>${esc(r.paymentDate)}</td><td><strong>${esc(r.paidBy)}</strong></td><td>${esc(r.invoiceId||"-")}<br><small>Project: ${esc(r.projectId||"-")}</small></td><td>${esc(r.method)}<br><small>${esc(r.reference||"No reference")}</small></td><td><strong>${money(r.amount)}</strong></td><td><button class="btn small secondary" onclick='openPreview("receipt", ${JSON.stringify(r)})'>View</button> <button class="btn small secondary" onclick='openDrawer("receipt", ${JSON.stringify(r)})'>Edit</button> <button class="btn small danger" onclick='removeItem("receipts","${esc(r.id)}")'>Delete</button></td></tr>`).join("")}</tbody></table></div>`:empty("No receipts yet","Create receipts after payment is received.")}`;
}
function settingsPage(){
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
    <div class="card pad"><h3>Business Profile</h3><p class="note">Owner: Dr. Joko Slamet. Add logo, address, bank account, WhatsApp, email, invoice footer, and signature in future development.</p></div>
    <div class="card pad"><h3>Payment Settings</h3><p class="note">Define default payment methods, payment terms, due dates, tax, and administrative fees.</p></div>
    <div class="card pad"><h3>Workflow Rules</h3><p class="note">Customize journal categories, project status, reminders, and resubmission tracking.</p></div>
  </div>`;
}

function drawerHTML(){
  if(!state.drawer) return "";
  const title = state.drawer==="project" ? (state.editItem?"Edit Project Order":"Create Project Order") : state.drawer==="invoice" ? (state.editItem?"Edit Invoice":"Create Invoice") : (state.editItem?"Edit Receipt":"Create Receipt");
  const form = state.drawer==="project" ? projectForm() : state.drawer==="invoice" ? invoiceForm() : receiptForm();
  return `<div class="drawer-bg show no-print"><div class="drawer"><div class="drawer-head"><div><h3>${title}</h3><p>Complete the form and save your data.</p></div><button class="btn secondary small" onclick="closeDrawer()">✕</button></div><div class="drawer-body">${form}</div></div></div>`;
}
function val(obj,k,def=""){ return esc((obj&&obj[k]!==undefined)?obj[k]:def); }
function projectForm(){
  const p = state.editItem || {};
  return `<form class="form-grid" onsubmit="saveProjectForm(event)">
    <input name="id" value="${val(p,'id',id('JS-ORD',state.projects))}" placeholder="Project Order ID" required>
    <input name="orderDate" type="date" value="${val(p,'orderDate',new Date().toISOString().slice(0,10))}" required>
    <input class="span2" name="title" value="${val(p,'title')}" placeholder="Article / Project Title" required>
    <input name="leadOrder" value="${val(p,'leadOrder')}" placeholder="Lead Order / Client Name" required>
    <input name="correspondingAuthor" value="${val(p,'correspondingAuthor')}" placeholder="Corresponding Author">
    <input class="span2" name="authors" value="${esc((p.authors||[]).join(', '))}" placeholder="Authors separated by comma">
    <select name="journalType">${journalTypes.map(x=>`<option ${p.journalType===x?'selected':''}>${x}</option>`).join("")}</select>
    <input name="targetJournal" value="${val(p,'targetJournal')}" placeholder="Target Journal" required>
    <input name="price" type="number" value="${val(p,'price')}" placeholder="Project Price / Service Fee">
    <select name="paymentTerm">${paymentTerms.map(x=>`<option ${p.paymentTerm===x?'selected':''}>${x}</option>`).join("")}</select>
    <select name="status">${projectStatuses.map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join("")}</select>
    <input name="deadline" type="date" value="${val(p,'deadline')}">
    <input class="span2" name="resubmitTo" value="${val(p,'resubmitTo')}" placeholder="If rejected, resubmit to journal">
    <textarea class="span2" name="notes" placeholder="Notes">${val(p,'notes')}</textarea>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Project</button></div>
  </form>`;
}
function invoiceForm(){
  const i=state.editItem||{};
  return `<form class="form-grid" onsubmit="saveInvoiceForm(event)">
    <input name="id" value="${val(i,'id',id('JS-INV',state.invoices))}" placeholder="Invoice Number" required>
    <select name="projectId" onchange="fillInvoiceProject(this.value)"><option value="">Select Project Order</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${i.projectId===p.id?'selected':''}>${esc(p.id)} - ${esc(p.title)}</option>`).join("")}</select>
    <input name="issueDate" type="date" value="${val(i,'issueDate',new Date().toISOString().slice(0,10))}">
    <input name="dueDate" type="date" value="${val(i,'dueDate')}">
    <input name="billTo" value="${val(i,'billTo')}" placeholder="Bill To / Client" required>
    <select name="status">${invoiceStatuses.map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join("")}</select>
    <textarea class="span2" name="description" placeholder="Invoice Description" required>${val(i,'description')}</textarea>
    <input name="amount" type="number" value="${val(i,'amount')}" placeholder="Amount" oninput="calcInvoiceTotal()">
    <input name="discount" type="number" value="${val(i,'discount')}" placeholder="Discount" oninput="calcInvoiceTotal()">
    <input name="tax" type="number" value="${val(i,'tax')}" placeholder="Tax / Admin Fee" oninput="calcInvoiceTotal()">
    <div class="card pad"><small>Invoice Total</small><h3 id="invoiceTotal">${money((Number(i.amount||0)-Number(i.discount||0)+Number(i.tax||0)))}</h3></div>
    <textarea class="span2" name="notes" placeholder="Invoice notes">${val(i,'notes')}</textarea>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Invoice</button></div>
  </form>`;
}
function receiptForm(){
  const r=state.editItem||{};
  return `<form class="form-grid" onsubmit="saveReceiptForm(event)">
    <input name="id" value="${val(r,'id',id('JS-RCP',state.receipts))}" placeholder="Receipt Number" required>
    <select name="invoiceId" onchange="fillReceiptInvoice(this.value)"><option value="">Select Invoice</option>${state.invoices.map(i=>`<option value="${esc(i.id)}" ${r.invoiceId===i.id?'selected':''}>${esc(i.id)} - ${esc(i.billTo)}</option>`).join("")}</select>
    <select name="projectId"><option value="">Select Project Order</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${r.projectId===p.id?'selected':''}>${esc(p.id)} - ${esc(p.title)}</option>`).join("")}</select>
    <input name="paymentDate" type="date" value="${val(r,'paymentDate',new Date().toISOString().slice(0,10))}">
    <input name="paidBy" value="${val(r,'paidBy')}" placeholder="Paid By" required>
    <input name="amount" type="number" value="${val(r,'amount')}" placeholder="Paid Amount" required>
    <select name="method">${receiptMethods.map(x=>`<option ${r.method===x?'selected':''}>${x}</option>`).join("")}</select>
    <input name="reference" value="${val(r,'reference')}" placeholder="Transfer Reference / Transaction ID">
    <input class="span2" name="receivedBy" value="${val(r,'receivedBy','Dr. Joko Slamet')}" placeholder="Received By">
    <textarea class="span2" name="notes" placeholder="Receipt notes">${val(r,'notes')}</textarea>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Receipt</button></div>
  </form>`;
}
function formData(e){ const fd=new FormData(e.target); return Object.fromEntries(fd.entries()); }
function saveProjectForm(e){
  e.preventDefault(); const x=formData(e); x.authors=(x.authors||"").split(",").map(a=>a.trim()).filter(Boolean); x.price=Number(x.price||0);
  const ix=state.projects.findIndex(p=>p.id===x.id); if(ix>=0) state.projects[ix]=x; else state.projects.unshift(x);
  save(); closeDrawer();
}
function saveInvoiceForm(e){
  e.preventDefault(); const x=formData(e); x.amount=Number(x.amount||0); x.discount=Number(x.discount||0); x.tax=Number(x.tax||0); x.total=x.amount-x.discount+x.tax;
  const ix=state.invoices.findIndex(i=>i.id===x.id); if(ix>=0) state.invoices[ix]=x; else state.invoices.unshift(x);
  save(); closeDrawer();
}
function saveReceiptForm(e){
  e.preventDefault(); const x=formData(e); x.amount=Number(x.amount||0);
  const ix=state.receipts.findIndex(r=>r.id===x.id); if(ix>=0) state.receipts[ix]=x; else state.receipts.unshift(x);
  const inv=state.invoices.find(i=>i.id===x.invoiceId);
  if(inv){ const paid=state.receipts.filter(r=>r.invoiceId===inv.id).reduce((s,r)=>s+Number(r.amount||0),0); inv.status = paid >= Number(inv.total||0) ? "Paid" : paid > 0 ? "Partially Paid" : inv.status; }
  save(); closeDrawer();
}
function fillInvoiceProject(pid){
  const p=state.projects.find(x=>x.id===pid); if(!p) return;
  const f=document.querySelector(".drawer form"); f.billTo.value=p.leadOrder||""; f.description.value=p.title||""; f.amount.value=p.price||0; calcInvoiceTotal();
}
function calcInvoiceTotal(){
  const f=document.querySelector(".drawer form"); if(!f) return;
  const total=Number(f.amount.value||0)-Number(f.discount.value||0)+Number(f.tax.value||0);
  const el=document.getElementById("invoiceTotal"); if(el) el.textContent=money(total);
}
function fillReceiptInvoice(iid){
  const inv=state.invoices.find(x=>x.id===iid); if(!inv) return;
  const f=document.querySelector(".drawer form"); f.projectId.value=inv.projectId||""; f.paidBy.value=inv.billTo||""; f.amount.value=inv.total||inv.amount||0;
}
function previewHTML(){
  if(!state.preview) return "";
  const {type,item}=state.preview;
  const project=state.projects.find(p=>p.id===item.projectId) || {};
  const title=type==="invoice"?"INVOICE":"OFFICIAL RECEIPT";
  const date=type==="invoice"?item.issueDate:item.paymentDate;
  const client=type==="invoice"?item.billTo:item.paidBy;
  const amount=type==="invoice"?item.total:item.amount;
  return `<div class="drawer-bg show"><div class="drawer"><div class="drawer-head no-print"><div><h3>${title} Preview</h3><p>Preview, print, or close this document.</p></div><div><button class="btn secondary small" onclick="window.print()">Print</button> <button class="btn secondary small" onclick="closePreview()">✕</button></div></div><div class="drawer-body" id="printArea"><div class="doc">
    <div class="doc-head"><div><h2 style="margin:0">JSOrderLit Manager</h2><p class="note">Article Project Order Management<br>Prepared by Dr. Joko Slamet</p></div><div style="text-align:right"><div class="doc-title">${title}</div><p class="note">No: ${esc(item.id)}<br>Date: ${esc(date)}</p></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px"><div><small>Client</small><h3>${esc(client)}</h3></div><div><small>Project</small><h3>${esc(item.projectId||"-")}</h3><p class="note">${esc(project.title||item.description||"-")}</p></div></div>
    <table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr><td>${type==="invoice"?esc(item.description):`Payment received via ${esc(item.method)} ${item.reference?`, reference ${esc(item.reference)}`:""}`}</td><td style="text-align:right"><strong>${money(amount)}</strong></td></tr>${type==="invoice"?`<tr><td style="text-align:right">Discount</td><td style="text-align:right">${money(item.discount)}</td></tr><tr><td style="text-align:right">Tax/Admin Fee</td><td style="text-align:right">${money(item.tax)}</td></tr>`:""}</tbody><tfoot><tr><td style="text-align:right"><strong>TOTAL</strong></td><td style="text-align:right"><strong>${money(amount)}</strong></td></tr></tfoot></table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px"><div><small>Notes</small><p class="note">${esc(item.notes||"-")}</p></div><div style="text-align:right"><p class="note" style="margin-bottom:70px">Authorized Signature</p><strong>Dr. Joko Slamet</strong></div></div>
  </div></div></div></div>`;
}
function render(){
  let content = state.active==="Dashboard" ? dashboard() : state.active==="Projects" ? projectsPage() : state.active==="Invoices" ? invoicesPage() : state.active==="Receipts" ? receiptsPage() : settingsPage();
  document.getElementById("app").innerHTML = shell(content);
}
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
